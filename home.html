<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scratchlet - Home</title>
<link rel="icon" type="image/webp" sizes="32x32" href="https://i.postimg.cc/zXFdxKTw/Icon-Tab.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Titan+One&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
/* =========================
   GLOBAL & HIDE SCROLLBAR
========================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body {
    scrollbar-width: none; 
}

::-webkit-scrollbar {
    display: none;
}

body{
    font-family:"Nunito",sans-serif;
    color:white;
    overflow-x:hidden;
    min-height:100vh;
    background: #ff9b2f;
    position: relative;
    
    display: flex;
    flex-direction: column;
}

/* =========================
   BACKGROUND LAYERS
========================= */
.bg-base-gradient {
    position: fixed;
    inset: 0;
    z-index: -3;
    background: linear-gradient(160deg, #fff4d6 0%, #ffc76a 25%, #ff9b2f 50%, #ff7f11 75%, #8f3200 100%);
}

.bg-moving-grid {
    position: fixed;
    top: -50vh;
    left: -50vw;
    width: 200vw;
    height: 200vh;
    z-index: -2;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="126" height="126" viewBox="0 0 126 126"><rect x="0.5" y="0.5" width="61" height="61" rx="13.5" fill="rgba(0,0,0,0.18)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/><rect x="63.5" y="63.5" width="61" height="61" rx="13.5" fill="rgba(0,0,0,0.18)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/></svg>');
    background-size: 126px 126px;
    background-position: 63px 0px;
    will-change: transform;
    animation: scrollTiltedTopRight 8s linear infinite;
}

@keyframes scrollTiltedTopRight {
    from { transform: rotate(15deg) translate3d(0px, 0px, 0px); }
    to { transform: rotate(15deg) translate3d(126px, -126px, 0px); }
}

.bg-static-squares {
    position: fixed;
    top: -50vh;
    left: -50vw;
    width: 200vw;
    height: 200vh;
    z-index: -1;
    pointer-events: none;
    background: linear-gradient(135deg, #ffffff 0%, #ffe3b3 30%, #ffb666 60%, #ff9333 80%, #d65900 100%);
    -webkit-mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="126" height="126" viewBox="0 0 126 126"><rect x="0.5" y="0.5" width="61" height="61" rx="13.5" fill="black" stroke="black" stroke-width="1"/><rect x="63.5" y="63.5" width="61" height="61" rx="13.5" fill="black" stroke="black" stroke-width="1"/></svg>');
    mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="126" height="126" viewBox="0 0 126 126"><rect x="0.5" y="0.5" width="61" height="61" rx="13.5" fill="black" stroke="black" stroke-width="1"/><rect x="63.5" y="63.5" width="61" height="61" rx="13.5" fill="black" stroke="black" stroke-width="1"/></svg>');
    -webkit-mask-size: 126px 126px;
    mask-size: 126px 126px;
    transform: rotate(15deg);
    filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.15));
}

.bg-stroke-overlay {
    position: fixed;
    top: -50vh;
    left: -50vw;
    width: 200vw;
    height: 200vh;
    z-index: -1;
    pointer-events: none;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="126" height="126" viewBox="0 0 126 126"><rect x="0.5" y="0.5" width="61" height="61" rx="13.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/><rect x="63.5" y="63.5" width="61" height="61" rx="13.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/></svg>');
    background-size: 126px 126px;
    transform: rotate(15deg);
}

/* =========================
   NAVBAR
========================= */
.navbar{
    height:70px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 30px;
    background:#ff7f11;
    box-shadow: inset 0 -6px 0 0 #c65b00, 0 8px 24px rgba(0, 0, 0, 0.25);
    position: relative;
    z-index: 10;
}

.logo-link {
    text-decoration: none;
    display: inline-block;
}

.logo{
    font-family:"Titan One",cursive;
    font-size:2.5rem;
    color:white;
}

.nav-auth {
    display: flex;
    gap: 15px;
    align-items: center;
}

.user-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    background: rgba(0, 0, 0, 0.2);
    padding: 8px 16px;
    border-radius: 99px;
    border: 1px solid rgba(255, 255, 255, 0.15);
}

/* =========================
   BUTTONS
========================= */
.btn{
    font-family:"Nunito",sans-serif;
    font-weight:900;
    border:none;
    cursor:pointer;
    letter-spacing:.3px;
    font-size:0.95rem;
    text-decoration:none;
    display:inline-block;
    padding:12px 24px;
    border-radius:14px;
    position: relative;
    text-align: center;
    
    box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    transform: translateY(0);
    transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.1s ease;
}

.primary{
    background: white;
    color: #ff8c1a;
}

.secondary {
    background: rgba(0, 0, 0, 0.3);
    color: white;
    border: 2px solid rgba(255, 255, 255, 0.3);
    padding: 10px 22px;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 0 rgba(0,0,0,0.18);
    filter: brightness(1.05);
}

.btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.2);
    filter: brightness(0.95);
    transition: transform 0.04s ease, box-shadow 0.04s ease;
}

/* =========================
   HERO CONTAINER
========================= */
.hero-container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    position: relative;
    z-index: 5;
}

.hero-card {
    max-width: 650px;
    width: 100%;
    background: rgba(0, 0, 0, 0.28);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 24px;
    padding: 50px 40px;
    box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.2);
    text-align: center;
}

.hero-card h1 {
    font-family: "Titan One", cursive;
    font-size: 3.5rem;
    margin-bottom: 15px;
    text-shadow: 0 4px 0 rgba(0,0,0,.15);
}

.hero-card p {
    font-size: 1.2rem;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.9);
    margin-bottom: 35px;
    line-height: 1.6;
}

.main-cta {
    padding: 16px 40px;
    font-size: 1.2rem;
}

/* =========================
   FOOTER
========================= */
footer{
    text-align:center;
    padding:30px;
    background:rgba(0,0,0,.12);
    font-weight:700;
    position: relative;
    z-index: 5;
    margin-top: auto; 
}

/* =========================
   MOBILE RESPONSIVENESS
========================= */
@media(max-width:700px){
    .bg-moving-grid, .bg-static-squares, .bg-stroke-overlay {
        top: -60vh;
        left: -60vw;
        width: 220vw;
        height: 220vh;
        background-size: 126px 126px;
    }

    .navbar { 
        height: auto;
        padding: 16px 15px; 
        flex-direction: column;
        gap: 15px;
        justify-content: center;
    }
    
    .logo-link {
        width: 100%;
        text-align: center;
    }

    .logo { font-size: 2rem; }
    .hero-container { padding: 30px 15px; }
    .hero-card { padding: 30px 20px; }
    .hero-card h1 { font-size: 2.5rem; }
}
</style>
</head>

<body>

<div class="bg-base-gradient"></div>
<div class="bg-moving-grid"></div>
<div class="bg-static-squares"></div>
<div class="bg-stroke-overlay"></div>

<nav class="navbar">
    <a href="index.html" class="logo-link"><div class="logo">Scratchlet</div></a>
    
    <div id="nav-auth-box" class="nav-auth">
        </div>
</nav>

<main class="hero-container">
    <div class="hero-card">
        <h1 id="welcome-title">Scratchlet</h1>
        <p id="welcome-desc">The ultimate gaming space. Scratch, collect items, complete application quests, and build up your public profile inventory showcase.</p>
        
        <div id="hero-action-box">
            </div>
    </div>
</main>

<footer>
    © 2026 Scratchlet
</footer>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBNZBOY8xzZOlxAD9V_RUqY054-kKod8gE",
        authDomain: "scratchlet-194bc.firebaseapp.com",
        projectId: "scratchlet-194bc",
        storageBucket: "scratchlet-194bc.firebasestorage.app",
        messagingSenderId: "480952290764",
        appId: "1:480952290764:web:0be65205e0b3ff2db16169",
        measurementId: "G-2T6GS8Y9VN"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const navAuthBox = document.getElementById('nav-auth-box');
    const welcomeTitle = document.getElementById('welcome-title');
    const heroActionBox = document.getElementById('hero-action-box');

    // Monitor account connection streams live
    onAuthStateChanged(auth, (user) => {
        if (user) {
            // User logged in state
            const username = user.displayName || "Player";
            
            welcomeTitle.textContent = `Welcome, ${username}!`;
            
            navAuthBox.innerHTML = `
                <div class="user-badge">
                    <span class="material-icons">account_circle</span>
                    <span>${username}</span>
                </div>
                <button id="logout-btn" class="btn secondary">Log Out</button>
            `;

            heroActionBox.innerHTML = `
                <a href="game.html" class="btn primary main-cta"><span>Enter Dashboard</span></a>
            `;

            // Attach event listener to dynamically created button
            document.getElementById('logout-btn').addEventListener('click', () => {
                signOut(auth).then(() => {
                    window.location.reload();
                });
            });

        } else {
            // Guest anonymous visitor state
            welcomeTitle.textContent = "Scratchlet";
            
            navAuthBox.innerHTML = `
                <a href="login.html" class="btn secondary">Log In</a>
                <a href="register.html" class="btn primary">Register</a>
            `;

            heroActionBox.innerHTML = `
                <a href="register.html" class="btn primary main-cta"><span>Get Started Now</span></a>
            `;
        }
    });
</script>

</body>
</html>

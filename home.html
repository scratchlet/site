<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scratchlet - Home</title>
<link rel="icon" type="image/webp" sizes="32x32" href="https://i.postimg.cc/zXFdxKTw/Icon-Tab.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Titan+One&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
/* =========================
   GLOBAL & HIDE SCROLLBAR
========================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body {
    scrollbar-width: none; 
}

::-webkit-scrollbar {
    display: none;
}

body{
    font-family:"Nunito",sans-serif;
    color:white;
    overflow-x:hidden;
    min-height:100vh;
    background: #ff9b2f;
    position: relative;
    
    display: flex;
    flex-direction: column;
}

/* =========================
   BACKGROUND LAYERS
========================= */
.bg-base-gradient {
    position: fixed;
    inset: 0;
    z-index: -3;
    background: linear-gradient(160deg, #fff4d6 0%, #ffc76a 25%, #ff9b2f 50%, #ff7f11 75%, #8f3200 100%);
}

.bg-moving-grid {
    position: fixed;
    top: -50vh;
    left: -50vw;
    width: 200vw;
    height: 200vh;
    z-index: -2;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="126" height="126" viewBox="0 0 126 126"><rect x="0.5" y="0.5" width="61" height="61" rx="13.5" fill="rgba(0,0,0,0.18)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/><rect x="63.5" y="63.5" width="61" height="61" rx="13.5" fill="rgba(0,0,0,0.18)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/></svg>');
    background-size: 126px 126px;
    background-position: 63px 0px;
    will-change: transform;
    animation: scrollTiltedTopRight 8s linear infinite;
}

@keyframes scrollTiltedTopRight {
    from { transform: rotate(15deg) translate3d(0px, 0px, 0px); }
    to { transform: rotate(15deg) translate3d(126px, -126px, 0px); }
}

.bg-static-squares {
    position: fixed;
    top: -50vh;
    left: -50vw;
    width: 200vw;
    height: 200vh;
    z-index: -1;
    pointer-events: none;
    background: linear-gradient(135deg, #ffffff 0%, #ffe3b3 30%, #ffb666 60%, #ff9333 80%, #d65900 100%);
    -webkit-mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="126" height="126" viewBox="0 0 126 126"><rect x="0.5" y="0.5" width="61" height="61" rx="13.5" fill="black" stroke="black" stroke-width="1"/><rect x="63.5" y="63.5" width="61" height="61" rx="13.5" fill="black" stroke="black" stroke-width="1"/></svg>');
    mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="126" height="126" viewBox="0 0 126 126"><rect x="0.5" y="0.5" width="61" height="61" rx="13.5" fill="black" stroke="black" stroke-width="1"/><rect x="63.5" y="63.5" width="61" height="61" rx="13.5" fill="black" stroke="black" stroke-width="1"/></svg>');
    -webkit-mask-size: 126px 126px;
    mask-size: 126px 126px;
    transform: rotate(15deg);
    filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.15));
}

.bg-stroke-overlay {
    position: fixed;
    top: -50vh;
    left: -50vw;
    width: 200vw;
    height: 200vh;
    z-index: -1;
    pointer-events: none;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="126" height="126" viewBox="0 0 126 126"><rect x="0.5" y="0.5" width="61" height="61" rx="13.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/><rect x="63.5" y="63.5" width="61" height="61" rx="13.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/></svg>');
    background-size: 126px 126px;
    transform: rotate(15deg);
}

/* =========================
   NAVBAR & HUD
========================= */
.navbar{
    min-height:70px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 30px;
    background:#ff7f11;
    box-shadow: inset 0 -6px 0 0 #c65b00, 0 8px 24px rgba(0, 0, 0, 0.25);
    position: relative;
    z-index: 10;
    flex-wrap: wrap;
    gap: 15px;
}

.logo-link {
    text-decoration: none;
    display: inline-block;
}

.logo{
    font-family:"Titan One",cursive;
    font-size:2.5rem;
    color:white;
}

.nav-auth {
    display: flex;
    gap: 15px;
    align-items: center;
    flex-wrap: wrap;
}

.user-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    background: rgba(0, 0, 0, 0.2);
    padding: 8px 16px;
    border-radius: 99px;
    border: 1px solid rgba(255, 255, 255, 0.15);
}

/* HUD Link Bar */
.hud-badge-bar {
    display: flex;
    align-items: center;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 99px;
    padding: 4px;
    gap: 4px;
}

.hud-item {
    color: white;
    text-decoration: none;
    font-weight: 800;
    font-size: 0.9rem;
    padding: 6px 14px;
    border-radius: 99px;
    transition: background 0.15s, color 0.15s;
    background: transparent;
    border: none;
    cursor: pointer;
    font-family: inherit;
}

.hud-item:hover {
    background: rgba(255, 255, 255, 0.15);
}

.hud-item.logout-trigger {
    color: #ff4d4d;
}

.hud-item.logout-trigger:hover {
    background: rgba(255, 77, 77, 0.2);
}

/* =========================
   BUTTONS
========================= */
.btn{
    font-family:"Nunito",sans-serif;
    font-weight:900;
    border:none;
    cursor:pointer;
    letter-spacing:.3px;
    font-size:0.95rem;
    text-decoration:none;
    display:inline-block;
    padding:12px 24px;
    border-radius:14px;
    position: relative;
    text-align: center;
    
    box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    transform: translateY(0);
    transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.1s ease;
}

.primary{
    background: white;
    color: #ff8c1a;
}

.secondary {
    background: rgba(0, 0, 0, 0.3);
    color: white;
    border: 2px solid rgba(255, 255, 255, 0.3);
    padding: 10px 22px;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 0 rgba(0,0,0,0.18);
    filter: brightness(1.05);
}

.btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.2);
    filter: brightness(0.95);
    transition: transform 0.04s ease, box-shadow 0.04s ease;
}

/* =========================
   DASHBOARD HOUSING
========================= */
.dashboard-grid {
    flex: 1;
    max-width: 900px;
    width: 100%;
    margin: 40px auto;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 25px;
    position: relative;
    z-index: 5;
}

.hero-card {
    background: rgba(0, 0, 0, 0.28);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 24px;
    padding: 45px 35px;
    box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.2);
    text-align: center;
}

.hero-card h1 {
    font-family: "Titan One", cursive;
    font-size: 3rem;
    margin-bottom: 25px;
    text-shadow: 0 4px 0 rgba(0,0,0,.15);
}

/* =========================
   SHORTCUT LINKS
========================= */
.shortcuts-panel {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-top: 10px;
}

.shortcut-card {
    background: rgba(255, 255, 255, 0.12);
    border: 2px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    padding: 20px 10px;
    color: white;
    text-decoration: none;
    font-weight: 800;
    font-size: 1.1rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.1);
    transition: background 0.15s, border-color 0.15s, transform 0.15s, box-shadow 0.15s;
}

.shortcut-card .material-icons {
    font-size: 2.2rem;
    color: #fff4d6;
}

.shortcut-card:hover {
    background: rgba(255, 255, 255, 0.2);
    border-color: white;
    transform: translateY(-4px);
    box-shadow: 0 8px 0 rgba(0,0,0,0.15);
}

.shortcut-card:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.1);
}

/* =========================
   CHANGELOG SYSTEM
========================= */
.changelog-card {
    background: rgba(0, 0, 0, 0.28);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 24px;
    padding: 35px;
    box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.2);
    margin-bottom: 40px;
}

.changelog-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    border-bottom: 2px solid rgba(255, 255, 255, 0.1);
    padding-bottom: 12px;
}

.changelog-header h2 {
    font-family: "Titan One", cursive;
    font-size: 1.8rem;
    display: flex;
    align-items: center;
    gap: 10px;
}

.log-content {
    font-weight: 600;
    line-height: 1.7;
    font-size: 1.05rem;
    color: rgba(255, 255, 255, 0.9);
    white-space: pre-wrap; 
}

/* Admin editor field */
.editor-box {
    display: none;
    flex-direction: column;
    gap: 12px;
    margin-top: 15px;
}

.editor-textarea {
    width: 100%;
    height: 140px;
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid rgba(255, 255, 255, 0.25);
    border-radius: 14px;
    padding: 14px;
    color: white;
    font-family: "Nunito", sans-serif;
    font-weight: 700;
    font-size: 1rem;
    outline: none;
    resize: vertical;
}

.editor-textarea:focus {
    border-color: white;
    background: rgba(255, 255, 255, 0.16);
}

.editor-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
}

/* =========================
   MOBILE RESPONSIVENESS
========================= */
@media(max-width:850px){
    .navbar { 
        padding: 15px; 
        flex-direction: column;
        gap: 15px;
    }

    .hud-badge-bar {
        border-radius: 16px;
        padding: 8px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        width: 100%;
        text-align: center;
    }

    .hud-item {
        padding: 8px 4px;
        border-radius: 8px;
    }

    .logo-link { width: 100%; text-align: center; }
}

@media(max-width:700px){
    .bg-moving-grid, .bg-static-squares, .bg-stroke-overlay {
        top: -60vh;
        left: -60vw;
        width: 220vw;
        height: 220vh;
    }

    .logo { font-size: 2rem; }
    .dashboard-grid { margin: 20px auto; padding: 0 15px; }
    .hero-card { padding: 30px 20px; }
    .hero-card h1 { font-size: 2rem; }
    
    .shortcuts-panel {
        grid-template-columns: repeat(2, 1fr);
    }
    
    .changelog-card { padding: 20px; }
}
</style>
</head>

<body>

<div class="bg-base-gradient"></div>
<div class="bg-moving-grid"></div>
<div class="bg-static-squares"></div>
<div class="bg-stroke-overlay"></div>

<nav class="navbar">
    <a href="index.html" class="logo-link"><div class="logo">Scratchlet</div></a>
    <div id="nav-auth-box" class="nav-auth"></div>
</nav>

<main class="dashboard-grid">
    <div class="hero-card">
        <h1 id="welcome-title">Hello!</h1>
        
        <div class="shortcuts-panel">
            <a href="market.html" class="shortcut-card">
                <span class="material-icons">storefront</span>
                <span>Market</span>
            </a>
            <a href="inventory.html" class="shortcut-card">
                <span class="material-icons">inventory_2</span>
                <span>Inventory</span>
            </a>
            <a href="news.html" class="shortcut-card">
                <span class="material-icons">newspaper</span>
                <span>News</span>
            </a>
            <a href="chat.html" class="shortcut-card">
                <span class="material-icons">forum</span>
                <span>Chat</span>
            </a>
        </div>
    </div>

    <div class="changelog-card">
        <div class="changelog-header">
            <h2><span class="material-icons" style="color:#fff4d6;">history_edu</span> Changelogs</h2>
            <button id="edit-changelog-btn" class="btn secondary" style="display:none; padding:6px 14px; border-radius:8px; font-size:0.85rem;">Edit</button>
        </div>
        
        <div id="log-display-view" class="log-content">Initial launch setup completed successfully. Authenticated navigation routers mapped. Loaded base structural models components.</div>
        
        <div id="admin-editor-box" class="editor-box">
            <textarea id="changelog-input-field" class="editor-textarea" placeholder="Update the changelog information text..."></textarea>
            <div class="editor-actions">
                <button id="cancel-edit-btn" class="btn secondary" style="padding:8px 16px; border-radius:10px;">Cancel</button>
                <button id="save-edit-btn" class="btn primary" style="padding:8px 20px; border-radius:10px;">Save Logs</button>
            </div>
        </div>
    </div>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBNZBOY8xzZOlxAD9V_RUqY054-kKod8gE",
        authDomain: "scratchlet-194bc.firebaseapp.com",
        projectId: "scratchlet-194bc",
        storageBucket: "scratchlet-194bc.firebasestorage.app",
        messagingSenderId: "480952290764",
        appId: "1:480952290764:web:0be65205e0b3ff2db16169",
        measurementId: "G-2T6GS8Y9VN"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const navAuthBox = document.getElementById('nav-auth-box');
    const welcomeTitle = document.getElementById('welcome-title');
    
    const editChangelogBtn = document.getElementById('edit-changelog-btn');
    const adminEditorBox = document.getElementById('admin-editor-box');
    const logDisplayView = document.getElementById('log-display-view');
    const changelogInputField = document.getElementById('changelog-input-field');
    const cancelEditBtn = document.getElementById('cancel-edit-btn');
    const saveEditBtn = document.getElementById('save-edit-btn');

    if(localStorage.getItem('scratchlet_changelog_cache')) {
        logDisplayView.textContent = localStorage.getItem('scratchlet_changelog_cache');
    }

    onAuthStateChanged(auth, (user) => {
        if (user) {
            const username = user.displayName || "Player";
            welcomeTitle.textContent = `Hello ${username}!`;
            
            navAuthBox.innerHTML = `
                <div class="user-badge">
                    <span class="material-icons">account_circle</span>
                    <span>${username}</span>
                </div>
                <div class="hud-badge-bar">
                    <a href="index.html" class="hud-item">Home</a>
                    <a href="market.html" class="hud-item">Market</a>
                    <a href="inventory.html" class="hud-item">Inventory</a>
                    <a href="stats.html" class="hud-item">Stats</a>
                    <a href="news.html" class="hud-item">News</a>
                    <a href="chat.html" class="hud-item">Chat</a>
                    <a href="trading.html" class="hud-item">Trading</a>
                    <a href="bazar.html" class="hud-item">Bazar</a>
                    <a href="settings.html" class="hud-item">Settings</a>
                    <button id="logout-hud-btn" class="hud-item logout-trigger">Logout</button>
                </div>
            `;

            document.getElementById('logout-hud-btn').addEventListener('click', () => {
                signOut(auth).then(() => { window.location.reload(); });
            });

            if (username === "SuperMemes_64") {
                editChangelogBtn.style.display = "inline-block";
            } else {
                editChangelogBtn.style.display = "none";
            }

        } else {
            window.location.href = "login.html";
        }
    });

    // Editor Panel Control Hooks
    editChangelogBtn.addEventListener('click', () => {
        changelogInputField.value = logDisplayView.textContent;
        logDisplayView.style.display = "none";
        editChangelogBtn.style.display = "none";
        adminEditorBox.style.display = "flex";
    });

    cancelEditBtn.addEventListener('click', () => {
        adminEditorBox.style.display = "none";
        logDisplayView.style.display = "block";
        editChangelogBtn.style.display = "inline-block";
    });

    saveEditBtn.addEventListener('click', () => {
        const updatedText = changelogInputField.value.trim();
        if(updatedText) {
            logDisplayView.textContent = updatedText;
            localStorage.setItem('scratchlet_changelog_cache', updatedText);
        }
        adminEditorBox.style.display = "none";
        logDisplayView.style.display = "block";
        editChangelogBtn.style.display = "inline-block";
    });
</script>

</body>
</html>

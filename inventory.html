<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scratchlet - Inventory</title>
<link rel="icon" type="image/webp" sizes="32x32" href="https://i.postimg.cc/zXFdxKTw/Icon-Tab.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Titan+One&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
/* =========================
   GLOBAL & HIDE SCROLLBAR
========================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body {
    scrollbar-width: none; 
}

::-webkit-scrollbar {
    display: none;
}

body{
    font-family:"Nunito",sans-serif;
    color:white;
    overflow-x:hidden;
    min-height:100vh;
    background: #ff9b2f;
    position: relative;
    
    display: flex;
    flex-direction: column;
}

/* =========================
   BACKGROUND LAYERS
========================= */
.bg-base-gradient {
    position: fixed;
    inset: 0;
    z-index: -3;
    background: linear-gradient(160deg, #fff4d6 0%, #ffc76a 25%, #ff9b2f 50%, #ff7f11 75%, #8f3200 100%);
}

.bg-moving-grid {
    position: fixed;
    top: -50vh;
    left: -50vw;
    width: 200vw;
    height: 200vh;
    z-index: -2;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="126" height="126" viewBox="0 0 126 126"><rect x="0.5" y="0.5" width="61" height="61" rx="13.5" fill="rgba(0,0,0,0.18)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/><rect x="63.5" y="63.5" width="61" height="61" rx="13.5" fill="rgba(0,0,0,0.18)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/></svg>');
    background-size: 126px 126px;
    background-position: 63px 0px;
    will-change: transform;
    animation: scrollTiltedTopRight 8s linear infinite;
}

@keyframes scrollTiltedTopRight {
    from { transform: rotate(15deg) translate3d(0px, 0px, 0px); }
    to { transform: rotate(15deg) translate3d(126px, -126px, 0px); }
}

.bg-static-squares {
    position: fixed;
    top: -50vh;
    left: -50vw;
    width: 200vw;
    height: 200vh;
    z-index: -1;
    pointer-events: none;
    background: linear-gradient(135deg, #ffffff 0%, #ffe3b3 30%, #ffb666 60%, #ff9333 80%, #d65900 100%);
    -webkit-mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="126" height="126" viewBox="0 0 126 126"><rect x="0.5" y="0.5" width="61" height="61" rx="13.5" fill="black" stroke="black" stroke-width="1"/><rect x="63.5" y="63.5" width="61" height="61" rx="13.5" fill="black" stroke="black" stroke-width="1"/></svg>');
    mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="126" height="126" viewBox="0 0 126 126"><rect x="0.5" y="0.5" width="61" height="61" rx="13.5" fill="black" stroke="black" stroke-width="1"/><rect x="63.5" y="63.5" width="61" height="61" rx="13.5" fill="black" stroke="black" stroke-width="1"/></svg>');
    -webkit-mask-size: 126px 126px;
    transform: rotate(15deg);
    filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.15));
}

.bg-stroke-overlay {
    position: fixed;
    top: -50vh;
    left: -50vw;
    width: 200vw;
    height: 200vh;
    z-index: -1;
    pointer-events: none;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="126" height="126" viewBox="0 0 126 126"><rect x="0.5" y="0.5" width="61" height="61" rx="13.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/><rect x="63.5" y="63.5" width="61" height="61" rx="13.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/></svg>');
    background-size: 126px 126px;
    transform: rotate(15deg);
}

/* =========================
   STICKY NAVBAR
========================= */
.navbar{
    position: sticky;
    top: 0;
    min-height:70px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 30px;
    background: rgba(255, 127, 17, 0.94);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    box-shadow: inset 0 -6px 0 0 #c65b00, 0 8px 24px rgba(0, 0, 0, 0.25);
    z-index: 100;
    gap: 15px;
}

.nav-left-group {
    display: flex;
    align-items: center;
    gap: 20px;
}

.logo-link {
    text-decoration: none;
    display: inline-block;
}

.logo{
    font-family:"Titan One",cursive;
    font-size:2.5rem;
    color:white;
}

.nav-right-group {
    display: flex;
    gap: 12px;
    align-items: center;
}

/* COIN COUNTER BADGE */
.coin-counter {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 900;
    background: rgba(0, 0, 0, 0.35);
    padding: 6px 14px;
    border-radius: 99px;
    border: 2px solid #ffcc00;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}

.coin-icon {
    width: 22px;
    height: 22px;
    object-fit: contain;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
}

.coin-amount {
    color: #ffd700;
    font-size: 1.05rem;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}

/* HUD Symbol Bar */
.hud-badge-bar {
    display: flex;
    align-items: center;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 99px;
    padding: 6px 12px;
    gap: 8px;
}

.hud-item {
    color: white;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: transparent;
    border: none;
    cursor: pointer;
    position: relative;
}

.hud-item .material-icons {
    font-size: 1.4rem;
}

.hud-item.logout-trigger {
    color: #ff5252;
}

/* =========================
   BUTTONS
========================= */
.btn {
    font-family:"Nunito",sans-serif;
    font-weight:900;
    border:none;
    cursor:pointer;
    letter-spacing:.3px;
    font-size:0.95rem;
    text-decoration:none;
    display:inline-block;
    padding:12px 24px;
    border-radius:14px;
    position: relative;
    text-align: center;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15);
}

.btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    box-shadow: none;
}

.secondary {
    background: rgba(0, 0, 0, 0.3);
    color: white;
    border: 2px solid rgba(255, 255, 255, 0.3);
}

.danger {
    background: linear-gradient(135deg, #ff5252, #c62828);
    color: white;
}

/* =================================
   INVENTORY CONTROLS & STRUCTURE
================================= */
.inventory-container {
    flex: 1;
    max-width: 95%; 
    width: 100%;
    margin: 40px auto;
    padding: 0 30px;
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 25px;
}

.inventory-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px;
}

.inventory-heading {
    font-family: "Titan One", cursive;
    font-size: 2.2rem;
    color: #ffffff;
    text-shadow: 3px 3px 0px #00000050;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.inventory-controls-group {
    display: flex;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

.search-input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
}

.search-input-wrapper .material-icons {
    position: absolute;
    left: 12px;
    color: rgba(255,255,255,0.5);
    font-size: 1.2rem;
}

.inventory-search-bar {
    background: rgba(0, 0, 0, 0.25);
    border: 2px solid rgba(255, 255, 255, 0.15);
    padding: 12px 14px 12px 38px;
    border-radius: 14px;
    font-family: "Nunito", sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    color: white;
    outline: none;
    min-width: 220px;
    transition: border-color 0.2s;
}

.inventory-search-bar:focus {
    border-color: #ff9b2f;
}

/* CATEGORY SELECTION DROPDOWN */
.category-dropdown-wrapper {
    background: rgba(0, 0, 0, 0.3);
    border: 2px solid rgba(255, 255, 255, 0.15);
    border-radius: 14px;
    padding: 2px 10px;
    display: flex;
    align-items: center;
}

.inventory-category-select {
    background: transparent;
    color: white;
    border: none;
    outline: none;
    font-family: "Nunito", sans-serif;
    font-weight: 800;
    font-size: 0.95rem;
    padding: 10px 24px 10px 5px;
    cursor: pointer;
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' fill='white'><path d='M7 10l5 5 5-5z'/></svg>");
    background-repeat: no-repeat;
    background-position: right center;
}

.inventory-category-select option {
    background: #ff9b2f;
    color: white;
    font-weight: 700;
}

/* SINGLE MASTER CARD CONTAINER HOLDING EVERYTHING (With hidden scroll bar) */
.master-inventory-card {
    background: rgba(0, 0, 0, 0.25);
    border: 3px solid rgba(255, 255, 255, 0.12);
    border-radius: 28px;
    padding: 35px;
    max-height: 70vh;
    overflow-y: auto;
    scrollbar-width: none; /* Hide scrollbar for Firefox */
}

.master-inventory-card::-webkit-scrollbar {
    display: none; /* Hide scrollbar for Chrome, Safari and Opera */
}

/* INCREASED BLOOK GRID UNIT SIZES (From 100px to 135px) */
.blook-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
    gap: 22px;
    padding-bottom: 5px;
}

/* =================================
   IMAGE BUTTON STATE LAYOUT RULES
================================= */
.blook-image-btn {
    background: rgba(0, 0, 0, 0.45);
    border: 3.5px solid transparent;
    border-radius: 20px;
    aspect-ratio: 1 / 1;
    width: 100%;
    padding: 14px;
    cursor: pointer;
    outline: none;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    transition: transform 0.15s ease, background-color 0.15s ease;
}

.blook-image-btn.owned:hover {
    transform: scale(1.04);
    background: rgba(0, 0, 0, 0.55);
}

/* OWNED ITEMS STYLES */
.blook-image-btn.owned {
    cursor: pointer;
}

.blook-image-btn.owned .blook-img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

/* NOT OWNED STATE */
.blook-image-btn.locked {
    border-color: #222222 !important;
    background: rgba(0, 0, 0, 0.7);
    cursor: default;
}

.blook-image-btn.locked .blook-img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    opacity: 0.25;
    filter: grayscale(100%) brightness(50%);
}

/* LOCK BADGE STYLING OVERLAYED CENTRALLY */
.lock-overlay-icon {
    position: absolute;
    font-size: 2.4rem;
    color: rgba(255, 255, 255, 0.45);
    pointer-events: none;
    z-index: 5;
}

/* DUPLICATE QUANTITY BADGE */
.quantity-badge {
    position: absolute;
    bottom: -4px;
    right: -4px;
    background: #ff9b2f;
    color: white;
    font-family: 'Titan One', cursive;
    font-size: 0.95rem;
    padding: 3px 9px;
    border-radius: 99px;
    border: 2px solid white;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    z-index: 10;
}

/* ====================================
   FIXED SIZE HORIZONTAL MODAL LAYOUT (Expanded sizing)
==================================== */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    z-index: 1500;
    display: none;
    align-items: center;
    justify-content: center;
}

.modal-content {
    background: linear-gradient(135deg, #2a1702 0%, #110800 100%);
    border: 4px solid #ff9b2f;
    border-radius: 32px;
    padding: 30px 40px;
    width: 680px; 
    max-width: 95vw;
    height: 380px;
    overflow: hidden;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 35px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.6);
    position: relative;
}

/* LEFT SIDE: PREVIEW PANEL */
.modal-left-panel {
    width: 180px;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    border-right: 2px solid rgba(255, 255, 255, 0.1);
    padding-right: 25px;
    flex-shrink: 0;
}

/* RIGHT SIDE: CONTROL PANEL */
.modal-right-panel {
    flex: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: left;
}

.modal-badges-container {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
}

.info-badge {
    padding: 4px 12px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 800;
    text-transform: uppercase;
}

.info-badge.drop {
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: #ffffff;
}

.info-badge.value {
    background: rgba(255, 215, 0, 0.15);
    border: 1px solid #ffd700;
    color: #ffd700;
}

.modal-blook-preview {
    width: 160px;
    height: 160px;
    object-fit: contain;
    display: block;
}

.sell-calc-row {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 10px;
    margin: 15px 0;
}

.sell-input {
    width: 130px;
    padding: 8px;
    font-family: 'Nunito', sans-serif;
    font-size: 1.25rem;
    font-weight: 900;
    text-align: center;
    background: rgba(0,0,0,0.4);
    border: 2px solid #ff9b2f;
    border-radius: 14px;
    color: #ffd700;
    outline: none;
}

/* SAFETY CONFIRMATION FIELD STYLING */
.safety-confirm-wrapper {
    display: none;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 15px;
    background: rgba(255, 82, 82, 0.1);
    border: 1px solid rgba(255, 82, 82, 0.3);
    padding: 8px 12px;
    border-radius: 12px;
}

.safety-confirm-input {
    width: 100%;
    padding: 6px 10px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    background: rgba(0,0,0,0.5);
    border: 2px solid #ff5252;
    border-radius: 8px;
    color: white;
    outline: none;
}

.modal-btn-group {
    display: flex;
    justify-content: flex-start;
    margin-top: 5px;
}

/* Responsive adjustments */
@media(max-width: 640px) {
    .modal-content {
        flex-direction: column;
        width: 320px;
        height: auto;
        max-height: 90vh;
        overflow-y: auto;
        gap: 15px;
        padding: 20px;
    }
    .modal-left-panel {
        width: 100%;
        height: auto;
        border-right: none;
        padding-right: 0;
        border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 12px;
    }
    .modal-right-panel {
        width: 100%;
        height: auto;
        text-align: center;
    }
    .modal-badges-container {
        justify-content: center;
    }
    .sell-calc-row {
        justify-content: center;
        flex-wrap: wrap;
    }
    .modal-btn-group {
        justify-content: center;
    }
    .navbar { padding: 12px 20px; flex-direction: column; }
    .inventory-container { padding: 0 15px; }
    .master-inventory-card { padding: 20px; max-height: 60vh; }
    .inventory-header {
        flex-direction: column;
        align-items: flex-start;
    }
    .inventory-controls-group {
        width: 100%;
    }
    .inventory-search-bar {
        min-width: 100%;
    }
}
</style>
</head>

<nav class="navbar">

const tokenCounterValue = document.getElementById('token-counter-value');
const inventoryMountNode = document.getElementById('inventory-mount-node');
const inventorySearchInput = document.getElementById('inventory-search-input');
const inventoryCategorySelect = document.getElementById('inventory-category-select');

const sellModal = document.getElementById('sell-modal');
const sellModalCard = document.getElementById('sell-modal-card');
const modalBlookName = document.getElementById('modal-blook-name');
const modalBlookRarityText = document.getElementById('modal-blook-rarity-text');
const modalBlookImage = document.getElementById('modal-blook-image');
const modalChanceBadge = document.getElementById('modal-chance-badge');
const modalValueBadge = document.getElementById('modal-value-badge');
const sellQuantityInput = document.getElementById('sell-quantity-input');
const confirmSellBtn = document.getElementById('confirm-sell-btn');
const sellMinBtn = document.getElementById('sell-min-btn');
const sellMaxBtn = document.getElementById('sell-max-btn');
const sellOneLeftBtn = document.getElementById('sell-one-left-btn');

const safetyWarningBox = document.getElementById('safety-warning-box');
const safetyBlookNameInput = document.getElementById('safety-blook-name-input');

let userTokens = 0;
let userInventoryMap = {};
let currentUserRef = null;
let selectedBlookToSell = null;
let isInventoryArray = false;
let currentViewMode = "packs"; 
let currentSelectedQty = 1;

function findBlookDetails(blookName) {
    for (const key in packsRegistry) {
        const found = packsRegistry[key].blooks.find(b => b.name === blookName);
        if (found) return { ...found, packId: key, packName: packsRegistry[key].name };
    }
    return null;
}

function renderInventoryLayout() {
    inventoryMountNode.innerHTML = "";
    inventoryMountNode.style.display = "flex";
    inventoryMountNode.style.flexDirection = "column";
    inventoryMountNode.style.gap = "30px";

    const searchQuery = inventorySearchInput.value.toLowerCase().trim();

    if (currentViewMode === "packs") {
        renderPacksView(searchQuery);
    } else {
        renderRaritiesView(searchQuery);
    }

    if(inventoryMountNode.lastChild) {
        inventoryMountNode.removeChild(inventoryMountNode.lastChild);
    }

    document.querySelectorAll('.blook-image-btn.owned').forEach(btn => {
        btn.addEventListener('click', () => {
            const bName = btn.getAttribute('data-blookname');
            const bCount = userInventoryMap[bName] || 0;
            const bDetails = findBlookDetails(bName);
            openSellWindow(bDetails, bCount);
        });
    });
}

function renderPacksView(searchQuery) {
    for (const packKey in packsRegistry) {
        const pack = packsRegistry[packKey];
        
        const visibleBlooks = pack.blooks.filter(blook => blook.name.toLowerCase().includes(searchQuery));
        if (visibleBlooks.length === 0 && searchQuery !== "") continue;

        const packHeader = document.createElement('h2');
        packHeader.style.fontFamily = "'Titan One', cursive";
        packHeader.style.fontSize = "1.5rem";
        packHeader.style.color = "#fff4d6";
        packHeader.style.textShadow = "2px 2px 0px rgba(0,0,0,0.4)";
        packHeader.style.marginBottom = "12px";
        packHeader.style.textTransform = "uppercase";
        packHeader.style.letterSpacing = "0.5px";
        packHeader.textContent = pack.name;

        const packGrid = document.createElement('div');
        packGrid.className = "blook-grid";

        let gridHtml = "";
        pack.blooks.forEach(blook => {
            if (!blook.name.toLowerCase().includes(searchQuery)) return;
            const count = userInventoryMap[blook.name] || 0;
            const isOwned = count > 0;

            if (isOwned) {
                gridHtml += `
                    <button class="blook-image-btn owned" data-blookname="${blook.name}" style="border-color: ${blook.color};" title="${blook.name} (${blook.rarity}) - Owned: ${count}">
                        <img src="${blook.image}" alt="${blook.name}" class="blook-img">
                        ${count > 1 ? `<div class="quantity-badge">x${count}</div>` : ''}
                    </button>
                `;
            } else {
                gridHtml += `
                    <button class="blook-image-btn locked" title="${blook.name} (${blook.rarity}) - Locked">
                        <span class="material-icons lock-overlay-icon">lock</span>
                        <img src="${blook.image}" alt="${blook.name}" class="blook-img">
                    </button>
                `;
            }
        });

        packGrid.innerHTML = gridHtml;

        const lineSeparator = document.createElement('hr');
        lineSeparator.style.border = "none";
        lineSeparator.style.borderTop = "2px solid rgba(255, 255, 255, 0.15)";
        lineSeparator.style.marginTop = "25px";

        inventoryMountNode.appendChild(packHeader);
        inventoryMountNode.appendChild(packGrid);
        inventoryMountNode.appendChild(lineSeparator);
    }
}

function renderRaritiesView(searchQuery) {
    let allBlooksFlattened = [];
    for (const key in packsRegistry) {
        packsRegistry[key].blooks.forEach(b => {
            if (!allBlooksFlattened.some(existing => existing.name === b.name)) {
                allBlooksFlattened.push(b);
            }
        });
    }

    rarityOrder.forEach(rarityName => {
        const rarityBlooks = allBlooksFlattened.filter(b => b.rarity === rarityName && b.name.toLowerCase().includes(searchQuery));
        if (rarityBlooks.length === 0) return;

        const rarityHeader = document.createElement('h2');
        rarityHeader.style.fontFamily = "'Titan One', cursive";
        rarityHeader.style.fontSize = "1.5rem";
        rarityHeader.style.color = rarityBlooks[0].color || "#fff4d6";
        rarityHeader.style.textShadow = "2px 2px 0px rgba(0,0,0,0.4)";
        rarityHeader.style.marginBottom = "12px";
        rarityHeader.style.textTransform = "uppercase";
        rarityHeader.style.letterSpacing = "0.5px";
        rarityHeader.textContent = rarityName;

        const rarityGrid = document.createElement('div');
        rarityGrid.className = "blook-grid";

        let gridHtml = "";
        rarityBlooks.forEach(blook => {
            const count = userInventoryMap[blook.name] || 0;
            const isOwned = count > 0;

            if (isOwned) {
                gridHtml += `
                    <button class="blook-image-btn owned" data-blookname="${blook.name}" style="border-color: ${blook.color};" title="${blook.name} (${blook.rarity}) - Owned: ${count}">
                        <img src="${blook.image}" alt="${blook.name}" class="blook-img">
                        ${count > 1 ? `<div class="quantity-badge">x${count}</div>` : ''}
                    </button>
                `;
            } else {
                gridHtml += `
                    <button class="blook-image-btn locked" title="${blook.name} (${blook.rarity}) - Locked">
                        <span class="material-icons lock-overlay-icon">lock</span>
                        <img src="${blook.image}" alt="${blook.name}" class="blook-img">
                    </button>
                `;
            }
        });

        rarityGrid.innerHTML = gridHtml;

        const lineSeparator = document.createElement('hr');
        lineSeparator.style.border = "none";
        lineSeparator.style.borderTop = "2px solid rgba(255, 255, 255, 0.15)";
        lineSeparator.style.marginTop = "25px";

        inventoryMountNode.appendChild(rarityHeader);
        inventoryMountNode.appendChild(rarityGrid);
        inventoryMountNode.appendChild(lineSeparator);
    });
}

function openSellWindow(blook, totalOwned) {
    selectedBlookToSell = { ...blook, ownedCount: totalOwned };
    
    modalBlookName.textContent = blook.name;
    modalBlookName.style.color = blook.color;
    modalBlookRarityText.textContent = blook.rarity;
    modalBlookRarityText.style.color = blook.color;
    modalBlookImage.src = blook.image;
    
    modalChanceBadge.textContent = dropChanceMap[blook.rarity] || "---";
    modalValueBadge.textContent = `${sellValueMap[blook.rarity] || 5} Tokens`;

    currentSelectedQty = 1;
    
    if (totalOwned > 1) {
        sellOneLeftBtn.style.display = "inline-block";
    } else {
        sellOneLeftBtn.style.display = "none";
    }

    safetyBlookNameInput.value = "";
    safetyWarningBox.style.display = "none";
    
    recalculateSellPayout();
    sellModal.style.display = "flex";
}

function closeSellWindow() {
    sellModal.style.display = "none";
    selectedBlookToSell = null;
}

function recalculateSellPayout() {
    if (!selectedBlookToSell) return;
    const rate = sellValueMap[selectedBlookToSell.rarity] || 5;
    
    if (currentSelectedQty > selectedBlookToSell.ownedCount) {
        currentSelectedQty = selectedBlookToSell.ownedCount;
    }
    if (currentSelectedQty < 1) {
        currentSelectedQty = 1;
    }

    sellQuantityInput.value = `${currentSelectedQty} / ${selectedBlookToSell.ownedCount}`;

    const totalCalculatedPayout = currentSelectedQty * rate;
    confirmSellBtn.innerHTML = `Sell Blook(s) (+${totalCalculatedPayout.toLocaleString()})`;
    
    if (currentSelectedQty < selectedBlookToSell.ownedCount) {
        safetyWarningBox.style.display = "none";
    }
}

sellQuantityInput.addEventListener('input', () => {
    if (!selectedBlookToSell) return;
    
    let cleanVal = sellQuantityInput.value.split('/')[0].replace(/\D/g, '');
    let typedNum = parseInt(cleanVal) || 1;
    
    currentSelectedQty = typedNum;
    recalculateSellPayout();
});

sellQuantityInput.addEventListener('click', () => {
    sellQuantityInput.setSelectionRange(0, sellQuantityInput.value.indexOf('/'));
});

inventorySearchInput.addEventListener('input', renderInventoryLayout);

inventoryCategorySelect.addEventListener('change', (e) => {
    currentViewMode = e.target.value;
    renderInventoryLayout();
});

sellModal.addEventListener('click', (event) => {
    if (!sellModalCard.contains(event.target)) {
        closeSellWindow();
    }
});

sellMinBtn.addEventListener('click', () => { currentSelectedQty = 1; recalculateSellPayout(); });
sellMaxBtn.addEventListener('click', () => { 
    if(selectedBlookToSell) {
        currentSelectedQty = selectedBlookToSell.ownedCount; 
        recalculateSellPayout(); 
    }
});

sellOneLeftBtn.addEventListener('click', () => {
    if (selectedBlookToSell) {
        if (selectedBlookToSell.ownedCount > 1) {
            currentSelectedQty = selectedBlookToSell.ownedCount - 1;
            recalculateSellPayout();
        }
    }
});

confirmSellBtn.addEventListener('click', async () => {
    if (!selectedBlookToSell || !currentUserRef) return;
    
    if (currentSelectedQty <= 0 || currentSelectedQty > selectedBlookToSell.ownedCount) return;

    if (currentSelectedQty === selectedBlookToSell.ownedCount) {
        if (safetyWarningBox.style.display !== "flex") {
            safetyWarningBox.style.display = "flex";
            safetyBlookNameInput.focus();
            return;
        }
        if (safetyBlookNameInput.value.trim() !== selectedBlookToSell.name) {
            alert("Verification mismatch. Please write the Blook's name correctly.");
            return;
        }
    }

    const valuePerUnit = sellValueMap[selectedBlookToSell.rarity] || 5;
    const payoutGained = currentSelectedQty * valuePerUnit;

    try {
        confirmSellBtn.disabled = true;

        if (userInventoryMap[selectedBlookToSell.name]) {
            userInventoryMap[selectedBlookToSell.name] -= currentSelectedQty;
            if (userInventoryMap[selectedBlookToSell.name] <= 0) {
                delete userInventoryMap[selectedBlookToSell.name];
            }
        }

        userTokens += payoutGained;

        let inventoryDataValue;
        if (isInventoryArray) {
            inventoryDataValue = [];
            Object.keys(userInventoryMap).forEach(blookName => {
                const count = userInventoryMap[blookName];
                for (let i = 0; i < count; i++) {
                    inventoryDataValue.push(blookName);
                }
            });
        } else {
            inventoryDataValue = userInventoryMap;
        }

        const firestoreDBModule = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
        await firestoreDBModule.updateDoc(currentUserRef, {
            tokens: userTokens,
            inventory: inventoryDataValue
        });

        tokenCounterValue.textContent = userTokens.toLocaleString();
        renderInventoryLayout();
        closeSellWindow();
    } catch(err) {
        console.error("Sale operation transaction failed:", err);
        alert("Transaction failed. Please try again.");
    } finally {
        confirmSellBtn.disabled = false;
    }
});

onAuthStateChanged(auth, async (user) => {
    if (user) {
        try {
            const firestoreModule = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
            currentUserRef = firestoreModule.doc(db, "users", user.uid);
            
            const userSnap = await firestoreModule.getDoc(currentUserRef);
            if (userSnap.exists()) {
                const userData = userSnap.data();
                userTokens = userData.tokens || 0;
                
                const rawInventory = userData.inventory || [];
                isInventoryArray = Array.isArray(rawInventory);
                
                userInventoryMap = {};
                if (isInventoryArray) {
                    rawInventory.forEach(blookName => {
                        userInventoryMap[blookName] = (userInventoryMap[blookName] || 0) + 1;
                    });
                } else {
                    userInventoryMap = rawInventory;
                }
                
                tokenCounterValue.textContent = userTokens.toLocaleString();
                renderInventoryLayout();
            }
        } catch (err) {
            console.error("Failed to load user profile data sets:", err);
        }

        document.getElementById('logout-hud-btn').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = "login.html";
            });
        });
    } else {
        window.location.href = "login.html";
    }
});
</script>

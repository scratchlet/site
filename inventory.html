<head>

<style>
/* =========================
   GLOBAL & HIDE SCROLLBAR
========================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body {
    scrollbar-width: none; 
}

::-webkit-scrollbar {
    display: none;
}

body{
    font-family:"Nunito",sans-serif;
    color:white;
    overflow-x:hidden;
    min-height:100vh;
    background: #ff9b2f;
    position: relative;
    
    display: flex;
    flex-direction: column;
}

/* =========================
   BACKGROUND LAYERS
========================= */
.bg-base-gradient {
    position: fixed;
    inset: 0;
    z-index: -3;
    background: linear-gradient(160deg, #fff4d6 0%, #ffc76a 25%, #ff9b2f 50%, #ff7f11 75%, #8f3200 100%);
}

.bg-moving-grid {
    position: fixed;
    top: -50vh;
    left: -50vw;
    width: 200vw;
    height: 200vh;
    z-index: -2;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="126" height="126" viewBox="0 0 126 126"><rect x="0.5" y="0.5" width="61" height="61" rx="13.5" fill="rgba(0,0,0,0.18)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/><rect x="63.5" y="63.5" width="61" height="61" rx="13.5" fill="rgba(0,0,0,0.18)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/></svg>');
    background-size: 126px 126px;
    background-position: 63px 0px;
    will-change: transform;
    animation: scrollTiltedTopRight 8s linear infinite;
}

@keyframes scrollTiltedTopRight {
    from { transform: rotate(15deg) translate3d(0px, 0px, 0px); }
    to { transform: rotate(15deg) translate3d(126px, -126px, 0px); }
}

.bg-static-squares {
    position: fixed;
    top: -50vh;
    left: -50vw;
    width: 200vw;
    height: 200vh;
    z-index: -1;
    pointer-events: none;
    background: linear-gradient(135deg, #ffffff 0%, #ffe3b3 30%, #ffb666 60%, #ff9333 80%, #d65900 100%);
    -webkit-mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="126" height="126" viewBox="0 0 126 126"><rect x="0.5" y="0.5" width="61" height="61" rx="13.5" fill="black" stroke="black" stroke-width="1"/><rect x="63.5" y="63.5" width="61" height="61" rx="13.5" fill="black" stroke="black" stroke-width="1"/></svg>');
    mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="126" height="126" viewBox="0 0 126 126"><rect x="0.5" y="0.5" width="61" height="61" rx="13.5" fill="black" stroke="black" stroke-width="1"/><rect x="63.5" y="63.5" width="61" height="61" rx="13.5" fill="black" stroke="black" stroke-width="1"/></svg>');
    -webkit-mask-size: 126px 126px;
    transform: rotate(15deg);
    filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.15));
}

.bg-stroke-overlay {
    position: fixed;
    top: -50vh;
    left: -50vw;
    width: 200vw;
    height: 200vh;
    z-index: -1;
    pointer-events: none;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="126" height="126" viewBox="0 0 126 126"><rect x="0.5" y="0.5" width="61" height="61" rx="13.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/><rect x="63.5" y="63.5" width="61" height="61" rx="13.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/></svg>');
    background-size: 126px 126px;
    transform: rotate(15deg);
}

/* =========================
   STICKY NAVBAR
========================= */
.navbar{
    position: sticky;
    top: 0;
    min-height:70px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 30px;
    background: rgba(255, 127, 17, 0.94);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    box-shadow: inset 0 -6px 0 0 #c65b00, 0 8px 24px rgba(0, 0, 0, 0.25);
    z-index: 100;
    gap: 15px;
}

.nav-left-group {
    display: flex;
    align-items: center;
    gap: 20px;
}

.logo-link {
    text-decoration: none;
    display: inline-block;
}

.logo{
    font-family:"Titan One",cursive;
    font-size:2.5rem;
    color:white;
}

.nav-right-group {
    display: flex;
    gap: 12px;
    align-items: center;
}

/* COIN COUNTER BADGE */
.coin-counter {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 900;
    background: rgba(0, 0, 0, 0.35);
    padding: 6px 14px;
    border-radius: 99px;
    border: 2px solid #ffcc00;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}

.coin-icon {
    width: 22px;
    height: 22px;
    object-fit: contain;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
}

.coin-amount {
    color: #ffd700;
    font-size: 1.05rem;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}

/* HUD Symbol Bar */
.hud-badge-bar {
    display: flex;
    align-items: center;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 99px;
    padding: 6px 12px;
    gap: 8px;
}

.hud-item {
    color: white;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: transparent;
    border: none;
    cursor: pointer;
    position: relative;
}

.hud-item .material-icons {
    font-size: 1.4rem;
}

.hud-item.logout-trigger {
    color: #ff5252;
}

/* =========================
   BUTTONS
========================= */
.btn {
    font-family:"Nunito",sans-serif;
    font-weight:900;
    border:none;
    cursor:pointer;
    letter-spacing:.3px;
    font-size:0.95rem;
    text-decoration:none;
    display:inline-block;
    padding:12px 24px;
    border-radius:14px;
    position: relative;
    text-align: center;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15);
}

.secondary {
    background: rgba(0, 0, 0, 0.3);
    color: white;
    border: 2px solid rgba(255, 255, 255, 0.3);
}

.danger {
    background: linear-gradient(135deg, #ff5252, #c62828);
    color: white;
}

/* =================================
   INVENTORY CONTAINER & UNIFIED MASTER CARD
================================= */
.inventory-container {
    flex: 1;
    max-width: 95%; 
    width: 100%;
    margin: 40px auto;
    padding: 0 30px;
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 25px;
}

.inventory-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.inventory-heading {
    font-family: "Titan One", cursive;
    font-size: 2rem;
    color: #ffffff;
    text-shadow: 3px 3px 0px #00000050;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.stats-summary {
    font-weight: 800;
    background: rgba(0,0,0,0.25);
    padding: 8px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    color: #fff4d6;
}

/* SINGLE MASTER CARD CONTAINER HOLDING EVERYTHING */
.master-inventory-card {
    background: rgba(0, 0, 0, 0.25);
    border: 3px solid rgba(255, 255, 255, 0.12);
    border-radius: 28px;
    padding: 30px;
    min-height: 200px;
}

.blook-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 18px;
}

/* =================================
   IMAGE BUTTON STATE LAYOUT RULES
================================= */
.blook-image-btn {
    background: rgba(0, 0, 0, 0.45);
    border: 3px solid transparent;
    border-radius: 16px;
    width: 100px;
    height: 100px;
    padding: 8px;
    cursor: pointer;
    outline: none;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
}

/* OWNED ITEMS STYLES */
.blook-image-btn.owned {
    cursor: pointer;
}

.blook-image-btn.owned .blook-img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

/* NOT OWNED STATE - DARK & GRAYSCALE WITH NO CURSOR INTERACTION */
.blook-image-btn.locked {
    border-color: #222222 !important;
    background: rgba(0, 0, 0, 0.7);
    cursor: default;
}

.blook-image-btn.locked .blook-img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    opacity: 0.25;
    filter: grayscale(100%) brightness(50%);
}

/* LOCK BADGE STYLING OVERLAYED CENTRALLY */
.lock-overlay-icon {
    position: absolute;
    font-size: 2rem;
    color: rgba(255, 255, 255, 0.45);
    pointer-events: none;
    z-index: 5;
}

/* DUPLICATE QUANTITY BADGE */
.quantity-badge {
    position: absolute;
    bottom: -6px;
    right: -4px;
    background: #ff9b2f;
    color: white;
    font-family: 'Titan One', cursive;
    font-size: 0.8rem;
    padding: 2px 7px;
    border-radius: 99px;
    border: 2px solid white;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    z-index: 10;
}

/* ====================================
   SELL MODAL INTERFACE (NO ANIMATIONS)
==================================== */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    z-index: 1500;
    display: none;
    align-items: center;
    justify-content: center;
}

.modal-content {
    background: linear-gradient(135deg, #2a1702 0%, #110800 100%);
    border: 4px solid #ff9b2f;
    border-radius: 28px;
    padding: 30px;
    width: 90%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
}

.modal-blook-preview {
    width: 120px;
    height: 120px;
    object-fit: contain;
    margin: 15px auto;
    display: block;
}

.sell-calc-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin: 20px 0;
}

.sell-input {
    width: 80px;
    padding: 8px;
    font-family: 'Nunito', sans-serif;
    font-size: 1.3rem;
    font-weight: 900;
    text-align: center;
    background: rgba(0,0,0,0.4);
    border: 2px solid #ff9b2f;
    border-radius: 12px;
    color: #ffd700;
    outline: none;
}

.total-payout-box {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 1.3rem;
    font-weight: 900;
    color: #ffd700;
    background: rgba(0,0,0,0.35);
    padding: 6px 16px;
    border-radius: 99px;
    border: 1px solid rgba(255,215,0,0.2);
    margin-bottom: 25px;
}

.modal-btn-group {
    display: flex;
    justify-content: center;
    gap: 15px;
}

.empty-state {
    text-align: center;
    padding: 40px;
    font-size: 1.2rem;
    font-weight: 700;
    color: #fff4d6;
}

/* Responsive adjustments */
@media(max-width: 768px) {
    .navbar { padding: 12px 20px; flex-direction: column; }
    .inventory-container { padding: 0 15px; }
    .master-inventory-card { padding: 20px; }
}
</style>
</head>

<body>

<div class="modal-overlay" id="sell-modal">
    <div class="modal-content" id="sell-modal-card">
        <h2 id="modal-blook-name" style="font-family:'Titan One'; font-size:1.6rem; text-transform: uppercase;">BLOOK NAME</h2>
        <div id="modal-blook-rarity-text" class="blook-rarity" style="margin-top: 4px; font-weight: 900; text-transform: uppercase;">RARITY</div>
        
        <img id="modal-blook-image" src="" alt="Blook Preview" class="modal-blook-preview">

            <img src="https://i.postimg.cc/vHtTN5Gn/Scratchlet-Token.webp" alt="Token" style="width:20px; height:20px; object-fit:contain;">
            <span id="total-sell-value">0</span>
        </div>
        
        <div class="modal-btn-group">
            <button class="btn secondary" id="close-sell-modal-btn" style="padding:10px 20px;">Cancel</button>
            <button class="btn danger" id="confirm-sell-btn" style="padding:10px 24px;">Sell Blook(s)</button>
        </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyBNZBOY8xzZOlxAD9V_RUqY054-kKod8gE",
    authDomain: "scratchlet-194bc.firebaseapp.com",
    projectId: "scratchlet-194bc",
    storageBucket: "scratchlet-194bc.firebasestorage.app",
    messagingSenderId: "480952290764",
    appId: "1:480952290764:web:0be65205e0b3ff2db16169",
    measurementId: "G-2T6GS8Y9VN"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let db;

try {
    const firestoreModule = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
    db = firestoreModule.getFirestore(app);
} catch(e) {
    console.error("Firestore instantiation issue:", e);
}

const sellValueMap = {
    "Uncommon": 5,
    "Rare": 15,
    "Epic": 65,
    "Legendary": 200,
    "Chroma": 300,
    "Celestial": 500,
    "Mystical": 1000
};

const packsRegistry = {
    breakfast: {
        name: "Breakfast Pack",
        blooks: [
            {name:"Toast",rarity:"Uncommon",color:"limegreen",image:"https://i.postimg.cc/Qdw9WbN1/Toast.webp"},
            {name:"Cereal",rarity:"Uncommon",color:"limegreen",image:"https://i.postimg.cc/KzD5x4SH/Cereal.webp"},
            {name:"Tomato Soup",rarity:"Uncommon",color:"limegreen",image:"https://i.postimg.cc/9QKRqpX9/Tomato-Soup.webp"},
            {name:"Yogurt",rarity:"Uncommon",color:"limegreen",image:"https://i.postimg.cc/RZy6nRCH/Yougurt.webp"},
            {name:"Breakfast Combo",rarity:"Uncommon",color:"limegreen",image:"https://i.postimg.cc/0NS6GwrD/Breakfast-Combo.webp"},
            {name:"Orange Juice",rarity:"Rare",color:"blue",image:"https://i.postimg.cc/jjfW67Cw/Orange-Juice.webp"},
            {name:"Milk",rarity:"Rare",color:"blue",image:"https://i.postimg.cc/xdmkGzqb/Milk.webp"},
            {name:"Waffle",rarity:"Rare",color:"blue",image:"https://i.postimg.cc/JzvDBq7j/Waffle.webp"},
            {name:"Pancakes",rarity:"Epic",color:"red",image:"https://i.postimg.cc/d0C7RyDZ/Pancakes.webp"},
            {name:"French Toast",rarity:"Epic",color:"red",image:"https://i.postimg.cc/jjfW67Cf/French-Toast.webp"},
            {name:"Pizza",rarity:"Legendary",color:"gold",image:"https://i.postimg.cc/bwWD2TY0/Pizza.webp"},
            {name:"Strawberry Milk",rarity:"Chroma",color:"cyan",image:"https://i.postimg.cc/wjZysVxQ/Strawberry-Milk.webp"},
            {name:"Chocolate Milk",rarity:"Chroma",color:"cyan",image:"https://i.postimg.cc/cJ3K7n6Y/Chocolate-Milk.webp"}
        ]
    }
};

const tokenCounterValue = document.getElementById('token-counter-value');
const inventoryMountNode = document.getElementById('inventory-mount-node');
const totalBlooksStat = document.getElementById('total-blooks-stat');
const uniqueBlooksStat = document.getElementById('unique-blooks-stat');

const sellModal = document.getElementById('sell-modal');
const modalBlookName = document.getElementById('modal-blook-name');
const modalBlookRarityText = document.getElementById('modal-blook-rarity-text');
const modalBlookImage = document.getElementById('modal-blook-image');
const modalOwnedCount = document.getElementById('modal-owned-count');
const sellQuantityInput = document.getElementById('sell-quantity-input');
const totalSellValue = document.getElementById('total-sell-value');
const closeSellModalBtn = document.getElementById('close-sell-modal-btn');
const confirmSellBtn = document.getElementById('confirm-sell-btn');
const sellMinBtn = document.getElementById('sell-min-btn');
const sellMaxBtn = document.getElementById('sell-max-btn');

let userTokens = 0;
let userInventoryArray = [];
let currentUserRef = null;
let selectedBlookToSell = null;

function findBlookDetails(blookName) {
    for (const key in packsRegistry) {
        const found = packsRegistry[key].blooks.find(b => b.name === blookName);
        if (found) return { ...found, packId: key, packName: packsRegistry[key].name };
    }
    return null;
}

function renderInventoryLayout() {
    // 1. Tally items currently sitting in the user's registry database
    const inventoryTally = {};
    let totalValidOwnedBlooks = 0;

    userInventoryArray.forEach(name => {
        const detailedData = findBlookDetails(name);
        if (!detailedData) return;
        inventoryTally[name] = (inventoryTally[name] || 0) + 1;
        totalValidOwnedBlooks++;
    });

    totalBlooksStat.textContent = totalValidOwnedBlooks;
    uniqueBlooksStat.textContent = Object.keys(inventoryTally).length;

    // 2. Loop through EVERY registered pack blook to present the unified master checklist grid
    let gridHtml = "";

    for (const packKey in packsRegistry) {
        packsRegistry[packKey].blooks.forEach(blook => {
            const count = inventoryTally[blook.name] || 0;
            const isOwned = count > 0;

            if (isOwned) {
                // Render fully colored interactive button with badge count
                gridHtml += `
                    <button class="blook-image-btn owned" data-blookname="${blook.name}" style="border-color: ${blook.color};" title="${blook.name} (${blook.rarity}) - Owned: ${count}">
                        <img src="${blook.image}" alt="${blook.name}" class="blook-img">
                        ${count > 1 ? `<div class="quantity-badge">x${count}</div>` : ''}
                    </button>
                `;
            } else {
                // Render darkened locked out button structure with absolute icon layout
                gridHtml += `
                    <button class="blook-image-btn locked" title="${blook.name} (${blook.rarity}) - Locked">
                        <span class="material-icons lock-overlay-icon">lock</span>
                        <img src="${blook.image}" alt="${blook.name}" class="blook-img">
                    </button>
                `;
            }
        });
    }

    inventoryMountNode.innerHTML = gridHtml;

    // Attach click triggers strictly to the owned buttons
    document.querySelectorAll('.blook-image-btn.owned').forEach(btn => {
        btn.addEventListener('click', () => {
            const bName = btn.getAttribute('data-blookname');
            const bCount = inventoryTally[bName];
            const bDetails = findBlookDetails(bName);
            openSellWindow(bDetails, bCount);
        });
    });
}

/* ====================================
   MODAL ACTIONS INTERACTION CODES
==================================== */
function openSellWindow(blook, totalOwned) {
    selectedBlookToSell = { ...blook, ownedCount: totalOwned };
    
    modalBlookName.textContent = blook.name;
    modalBlookName.style.color = blook.color;
    modalBlookRarityText.textContent = blook.rarity;
    modalBlookRarityText.style.color = blook.color;
    modalBlookImage.src = blook.image;
    modalOwnedCount.textContent = totalOwned;
    
    sellQuantityInput.value = 1;
    sellQuantityInput.max = totalOwned;
    
    recalculateSellPayout();
    sellModal.style.display = "flex";
}

function closeSellWindow() {
    sellModal.style.display = "none";
    selectedBlookToSell = null;
}

function recalculateSellPayout() {
    if (!selectedBlookToSell) return;
    const rate = sellValueMap[selectedBlookToSell.rarity] || 5;
    let typedAmount = parseInt(sellQuantityInput.value) || 0;
    
    if (typedAmount > selectedBlookToSell.ownedCount) {
        typedAmount = selectedBlookToSell.ownedCount;
        sellQuantityInput.value = typedAmount;
    }
    if (typedAmount < 1) {
        typedAmount = 1;
        sellQuantityInput.value = 1;
    }

    totalSellValue.textContent = (typedAmount * rate).toLocaleString();
}

sellQuantityInput.addEventListener('input', recalculateSellPayout);
sellMinBtn.addEventListener('click', () => { sellQuantityInput.value = 1; recalculateSellPayout(); });
sellMaxBtn.addEventListener('click', () => { 
    if(selectedBlookToSell) {
        sellQuantityInput.value = selectedBlookToSell.ownedCount; 
        recalculateSellPayout(); 
    }
});

closeSellModalBtn.addEventListener('click', closeSellWindow);

confirmSellBtn.addEventListener('click', async () => {
    if (!selectedBlookToSell || !currentUserRef) return;
    
    const qtyToSell = parseInt(sellQuantityInput.value) || 0;
    if (qtyToSell <= 0 || qtyToSell > selectedBlookToSell.ownedCount) return;

    const valuePerUnit = sellValueMap[selectedBlookToSell.rarity] || 5;
    const payoutGained = qtyToSell * valuePerUnit;

    try {
        confirmSellBtn.disabled = true;
        let instancesRemoved = 0;
        const freshUpdatedInventory = [];
        
        userInventoryArray.forEach(blookName => {
            if (blookName === selectedBlookToSell.name && instancesRemoved < qtyToSell) {
                instancesRemoved++;
            } else {
                freshUpdatedInventory.push(blookName);
            }
        });

        userTokens += payoutGained;
        userInventoryArray = freshUpdatedInventory;

        const firestoreModule = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
        await firestoreModule.updateDoc(currentUserRef, {
            tokens: userTokens,
            inventory: userInventoryArray
        });

        tokenCounterValue.textContent = userTokens.toLocaleString();
        renderInventoryLayout();
        closeSellWindow();
    } catch(err) {
        console.error("Sale operation transaction failed:", err);
        alert("Transaction failed. Please try again.");
    } finally {
        confirmSellBtn.disabled = false;
    }
});

/* ====================================
   INITIAL AUTH STATE LISTENERS
==================================== */
onAuthStateChanged(auth, async (user) => {
    if (user) {
        try {
            const firestoreModule = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
            currentUserRef = firestoreModule.doc(db, "users", user.uid);
            
            const userSnap = await firestoreModule.getDoc(currentUserRef);
            if (userSnap.exists()) {
                const userData = userSnap.data();
                userTokens = userData.tokens || 0;
                userInventoryArray = userData.inventory || [];
                
                tokenCounterValue.textContent = userTokens.toLocaleString();
                renderInventoryLayout();
            }
        } catch (err) {
            console.error("Failed to load user profile data sets:", err);
        }

        document.getElementById('logout-hud-btn').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = "login.html";
            });
        });
    } else {
        window.location.href = "login.html";
    }
});
</script>

<style>
/* =========================
   GLOBAL & HIDE SCROLLBAR
========================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body {
    scrollbar-width: none; 
}

::-webkit-scrollbar {
    display: none;
}

body{
    font-family:"Nunito",sans-serif;
    color:white;
    overflow-x:hidden;
    min-height:100vh;
    background: #ff9b2f;
    position: relative;
    
    display: flex;
    flex-direction: column;
}

/* =========================
   BACKGROUND LAYERS
========================= */
.bg-base-gradient {
    position: fixed;
    inset: 0;
    z-index: -3;
    background: linear-gradient(160deg, #fff4d6 0%, #ffc76a 25%, #ff9b2f 50%, #ff7f11 75%, #8f3200 100%);
}

.bg-moving-grid {
    position: fixed;
    top: -50vh;
    left: -50vw;
    width: 200vw;
    height: 200vh;
    z-index: -2;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="126" height="126" viewBox="0 0 126 126"><rect x="0.5" y="0.5" width="61" height="61" rx="13.5" fill="rgba(0,0,0,0.18)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/><rect x="63.5" y="63.5" width="61" height="61" rx="13.5" fill="rgba(0,0,0,0.18)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/></svg>');
    background-size: 126px 126px;
    background-position: 63px 0px;
    will-change: transform;
    animation: scrollTiltedTopRight 8s linear infinite;
}

@keyframes scrollTiltedTopRight {
    from { transform: rotate(15deg) translate3d(0px, 0px, 0px); }
    to { transform: rotate(15deg) translate3d(126px, -126px, 0px); }
}

.bg-static-squares {
    position: fixed;
    top: -50vh;
    left: -50vw;
    width: 200vw;
    height: 200vh;
    z-index: -1;
    pointer-events: none;
    background: linear-gradient(135deg, #ffffff 0%, #ffe3b3 30%, #ffb666 60%, #ff9333 80%, #d65900 100%);
    -webkit-mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="126" height="126" viewBox="0 0 126 126"><rect x="0.5" y="0.5" width="61" height="61" rx="13.5" fill="black" stroke="black" stroke-width="1"/><rect x="63.5" y="63.5" width="61" height="61" rx="13.5" fill="black" stroke="black" stroke-width="1"/></svg>');
    mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="126" height="126" viewBox="0 0 126 126"><rect x="0.5" y="0.5" width="61" height="61" rx="13.5" fill="black" stroke="black" stroke-width="1"/><rect x="63.5" y="63.5" width="61" height="61" rx="13.5" fill="black" stroke="black" stroke-width="1"/></svg>');
    -webkit-mask-size: 126px 126px;
    transform: rotate(15deg);
    filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.15));
}

.bg-stroke-overlay {
    position: fixed;
    top: -50vh;
    left: -50vw;
    width: 200vw;
    height: 200vh;
    z-index: -1;
    pointer-events: none;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="126" height="126" viewBox="0 0 126 126"><rect x="0.5" y="0.5" width="61" height="61" rx="13.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/><rect x="63.5" y="63.5" width="61" height="61" rx="13.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/></svg>');
    background-size: 126px 126px;
    transform: rotate(15deg);
}

/* =========================
   STICKY NAVBAR
========================= */
.navbar{
    position: sticky;
    top: 0;
    min-height:70px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 30px;
    background: rgba(255, 127, 17, 0.94);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    box-shadow: inset 0 -6px 0 0 #c65b00, 0 8px 24px rgba(0, 0, 0, 0.25);
    z-index: 100;
    gap: 15px;
}

.nav-left-group {
    display: flex;
    align-items: center;
    gap: 20px;
}

.logo-link {
    text-decoration: none;
    display: inline-block;
}

.logo{
    font-family:"Titan One",cursive;
    font-size:2.5rem;
    color:white;
}

.nav-right-group {
    display: flex;
    gap: 12px;
    align-items: center;
}

/* COIN COUNTER BADGE */
.coin-counter {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 900;
    background: rgba(0, 0, 0, 0.35);
    padding: 6px 14px;
    border-radius: 99px;
    border: 2px solid #ffcc00;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}

.coin-icon {
    width: 22px;
    height: 22px;
    object-fit: contain;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
}

.coin-amount {
    color: #ffd700;
    font-size: 1.05rem;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}

/* HUD Symbol Bar */
.hud-badge-bar {
    display: flex;
    align-items: center;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 99px;
    padding: 6px 12px;
    gap: 8px;
}

.hud-item {
    color: white;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: transparent;
    border: none;
    cursor: pointer;
    position: relative;
}

.hud-item .material-icons {
    font-size: 1.4rem;
}

.hud-item.logout-trigger {
    color: #ff5252;
}

/* =================================
   INVENTORY CONTAINER & UNIFIED MASTER CARD
================================= */
.inventory-container {
    flex: 1;
    max-width: 95%; 
    width: 100%;
    margin: 40px auto;
    padding: 0 30px;
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 25px;
}

.inventory-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.inventory-heading {
    font-family: "Titan One", cursive;
    font-size: 2rem;
    color: #ffffff;
    text-shadow: 3px 3px 0px #00000050;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.stats-summary {
    font-weight: 800;
    background: rgba(0,0,0,0.25);
    padding: 8px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    color: #fff4d6;
}

.master-inventory-card {
    background: rgba(0, 0, 0, 0.25);
    border: 3px solid rgba(255, 255, 255, 0.12);
    border-radius: 28px;
    padding: 30px;
    min-height: 200px;
}

.blook-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 18px;
}

/* BLOOK IMAGE BUTTONS */
.blook-image-btn {
    background: rgba(0, 0, 0, 0.45);
    border: 3px solid transparent;
    border-radius: 16px;
    width: 100px;
    height: 100px;
    padding: 8px;
    cursor: pointer;
    outline: none;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
}

.blook-image-btn.owned {
    cursor: pointer;
}

.blook-image-btn.owned .blook-img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

.blook-image-btn.locked {
    border-color: #222222 !important;
    background: rgba(0, 0, 0, 0.7);
    cursor: default;
}

.blook-image-btn.locked .blook-img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    opacity: 0.25;
    filter: grayscale(100%) brightness(50%);
}

.lock-overlay-icon {
    position: absolute;
    font-size: 2rem;
    color: rgba(255, 255, 255, 0.45);
    pointer-events: none;
    z-index: 5;
}

.quantity-badge {
    position: absolute;
    bottom: -6px;
    right: -4px;
    background: #ff9b2f;
    color: white;
    font-family: 'Titan One', cursive;
    font-size: 0.8rem;
    padding: 2px 7px;
    border-radius: 99px;
    border: 2px solid white;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    z-index: 10;
}

/* ====================================
   HORIZONTAL EVENED-OUT BLOCK CARD MODAL
==================================== */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    z-index: 1500;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.card-view-wrapper {
    position: relative;
    width: 100%;
    max-width: 580px; /* Expands wider for side-by-side design */
    background: #111111;
    border: 3px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 25px 60px rgba(0,0,0,0.85);
    display: flex;
    flex-direction: row; /* Aligns left and right blocks side-by-side */
    overflow: hidden;
    border-radius: 6px; /* Uniform flat box styling */
}

/* Left Dynamic Rarity Frame Side */
.card-art-section {
    position: relative;
    width: 45%; 
    min-height: 260px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    border-right: 4px solid rgba(0, 0, 0, 0.4);
}

.card-close-btn {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(0, 0, 0, 0.45);
    border: none;
    color: white;
    width: 32px;
    height: 32px;
    border-radius: 6px; 
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
}
.card-close-btn:hover {
    background: rgba(0, 0, 0, 0.65);
}

.card-blook-title {
    font-family: 'Titan One', cursive;
    font-size: 1.8rem;
    color: white;
    text-transform: uppercase;
    text-shadow: 3px 3px 0px rgba(0,0,0,0.85);
    margin-bottom: 15px;
    letter-spacing: 0.5px;
    text-align: center;
    z-index: 10;
}

.card-image-holder {
    width: 110px;
    height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
}

.card-main-img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 8px 10px rgba(0,0,0,0.4));
}

/* Right Actions & Settings Side */
.card-control-section {
    width: 55%;
    background: #151515;
    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 16px;
}

.card-count-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.9rem;
    font-weight: 800;
    color: #999999;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 0 2px;
}

.card-count-value {
    color: white;
    font-weight: 900;
    font-size: 1.1rem;
}

/* Flattened Stepper Block */
.card-input-stepper {
    display: flex;
    align-items: center;
    background: #1e1e1e;
    padding: 2px;
    border: 2px solid #2d2d2d;
    border-radius: 6px;
}

.stepper-btn {
    background: transparent;
    border: none;
    color: #ff9b2f;
    font-family: 'Titan One', cursive;
    font-size: 1.05rem;
    width: 44px;
    height: 44px;
    cursor: pointer;
    user-select: none;
    border-radius: 4px;
}
.stepper-btn:hover {
    color: #ffb666;
    background: rgba(255, 255, 255, 0.03);
}

.card-sell-field {
    flex: 1;
    background: transparent;
    border: none;
    color: white;
    font-family: 'Nunito', sans-serif;
    font-size: 1.3rem;
    font-weight: 900;
    text-align: center;
    outline: none;
    width: 100%;
}
.card-sell-field::-webkit-outer-spin-button,
.card-sell-field::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
}

.card-action-submit-btn {
    background: #ff9b2f;
    color: white;
    font-family: 'Titan One', cursive;
    font-size: 1.1rem;
    padding: 14px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2);
}
.card-action-submit-btn:hover {
    background: #ffb666;
}
.card-action-submit-btn:disabled {
    background: #2a2a2a !important;
    color: #555555;
    cursor: not-allowed;
    box-shadow: none;
}

.card-payout-counter {
    display: flex;
    align-items: center;
    gap: 4px;
    font-weight: 900;
    color: #ffd700;
}
</style>
</head>

const tokenCounterValue = document.getElementById('token-counter-value');
const inventoryMountNode = document.getElementById('inventory-mount-node');
const totalBlooksStat = document.getElementById('total-blooks-stat');
const uniqueBlooksStat = document.getElementById('unique-blooks-stat');

const sellModal = document.getElementById('sell-modal');
const modalBlookName = document.getElementById('modal-blook-name');
const cardDynamicBg = document.getElementById('card-dynamic-bg');
const modalBlookImage = document.getElementById('modal-blook-image');
const modalOwnedCount = document.getElementById('modal-owned-count');
const sellQuantityInput = document.getElementById('sell-quantity-input');
const totalSellValue = document.getElementById('total-sell-value');
const closeSellModalBtn = document.getElementById('close-sell-modal-btn');
const confirmSellBtn = document.getElementById('confirm-sell-btn');
const sellMinBtn = document.getElementById('sell-min-btn');
const sellMaxBtn = document.getElementById('sell-max-btn');

let userTokens = 0;
let userInventoryArray = []; 
let currentUserRef = null;
let selectedBlookToSell = null;

function findBlookDetails(blookName) {
    for (const key in packsRegistry) {
        const found = packsRegistry[key].blooks.find(b => b.name === blookName);
        if (found) return { ...found, packId: key, packName: packsRegistry[key].name };
    }
    return null;
}

function getInventoryCounts() {
    const counts = {};
    userInventoryArray.forEach(name => {
        counts[name] = (counts[name] || 0) + 1;
    });
    return counts;
}

function renderInventoryLayout() {
    let totalValidOwnedBlooks = 0;
    let uniqueCollectedCount = 0;
    const inventoryMap = getInventoryCounts();

    Object.keys(inventoryMap).forEach(name => {
        const count = inventoryMap[name] || 0;
        if (count > 0) {
            const detailedData = findBlookDetails(name);
            if (detailedData) {
                totalValidOwnedBlooks += count;
                uniqueCollectedCount++;
            }
        }
    });

    totalBlooksStat.textContent = totalValidOwnedBlooks;
    uniqueBlooksStat.textContent = uniqueCollectedCount;

    inventoryMountNode.innerHTML = "";
    inventoryMountNode.style.display = "flex";
    inventoryMountNode.style.flexDirection = "column";
    inventoryMountNode.style.gap = "30px";

    for (const packKey in packsRegistry) {
        const pack = packsRegistry[packKey];
        
        const packHeader = document.createElement('h2');
        packHeader.style.fontFamily = "'Titan One', cursive";
        packHeader.style.fontSize = "1.4rem";
        packHeader.style.color = "#fff4d6";
        packHeader.style.textShadow = "2px 2px 0px rgba(0,0,0,0.4)";
        packHeader.style.marginBottom = "10px";
        packHeader.style.textTransform = "uppercase";
        packHeader.style.letterSpacing = "0.5px";
        packHeader.textContent = pack.name;

        const packGrid = document.createElement('div');
        packGrid.className = "blook-grid";

        let gridHtml = "";
        pack.blooks.forEach(blook => {
            const count = inventoryMap[blook.name] || 0;
            const isOwned = count > 0;

            if (isOwned) {
                gridHtml += `
                    <button class="blook-image-btn owned" data-blookname="${blook.name}" style="border-color: ${blook.color};" title="${blook.name} (${blook.rarity}) - Owned: ${count}">
                        <img src="${blook.image}" alt="${blook.name}" class="blook-img">
                        ${count > 1 ? `<div class="quantity-badge">x${count}</div>` : ''}
                    </button>
                `;
            } else {
                gridHtml += `
                    <button class="blook-image-btn locked" title="${blook.name} (${blook.rarity}) - Locked">
                        <span class="material-icons lock-overlay-icon">lock</span>
                        <img src="${blook.image}" alt="${blook.name}" class="blook-img">
                    </button>
                `;
            }
        });

        packGrid.innerHTML = gridHtml;

        const lineSeparator = document.createElement('hr');
        lineSeparator.style.border = "none";
        lineSeparator.style.borderTop = "2px solid rgba(255, 255, 255, 0.15)";
        lineSeparator.style.marginTop = "25px";

        inventoryMountNode.appendChild(packHeader);
        inventoryMountNode.appendChild(packGrid);
        inventoryMountNode.appendChild(lineSeparator);
    }

    if(inventoryMountNode.lastChild) {
        inventoryMountNode.removeChild(inventoryMountNode.lastChild);
    }

    document.querySelectorAll('.blook-image-btn.owned').forEach(btn => {
        btn.addEventListener('click', () => {
            const bName = btn.getAttribute('data-blookname');
            const currentCounts = getInventoryCounts();
            const bCount = currentCounts[bName] || 0;
            const bDetails = findBlookDetails(bName);
            openSellWindow(bDetails, bCount);
        });
    });
}

/* ====================================
   MODAL ACTIONS INTERACTION CODES
==================================== */
function openSellWindow(blook, totalOwned) {
    selectedBlookToSell = { ...blook, ownedCount: totalOwned };
    
    modalBlookName.textContent = blook.name;
    modalBlookImage.src = blook.image;
    modalOwnedCount.textContent = totalOwned;
    
    const cardBgGradient = gradientRarityMap[blook.rarity] || "linear-gradient(to bottom, #4f6cf7, #1d2b7d)";
    cardDynamicBg.style.background = cardBgGradient;
    
    sellQuantityInput.value = 1;
    sellQuantityInput.max = totalOwned;
    
    recalculateSellPayout();
    sellModal.style.display = "flex";
}

function closeSellWindow() {
    sellModal.style.display = "none";
    selectedBlookToSell = null;
}

function recalculateSellPayout() {
    if (!selectedBlookToSell) return;
    const rate = sellValueMap[selectedBlookToSell.rarity] || 5;
    let typedAmount = parseInt(sellQuantityInput.value) || 0;
    
    if (typedAmount > selectedBlookToSell.ownedCount) {
        typedAmount = selectedBlookToSell.ownedCount;
        sellQuantityInput.value = typedAmount;
    }
    if (typedAmount < 1) {
        typedAmount = 1;
        sellQuantityInput.value = 1;
    }

    totalSellValue.textContent = (typedAmount * rate).toLocaleString();
}

sellQuantityInput.addEventListener('input', recalculateSellPayout);
sellMinBtn.addEventListener('click', () => { sellQuantityInput.value = 1; recalculateSellPayout(); });
sellMaxBtn.addEventListener('click', () => { 
    if(selectedBlookToSell) {
        sellQuantityInput.value = selectedBlookToSell.ownedCount; 
        recalculateSellPayout(); 
    }
});

closeSellModalBtn.addEventListener('click', closeSellWindow);

confirmSellBtn.addEventListener('click', async () => {
    if (!selectedBlookToSell || !currentUserRef) return;
    
    const qtyToSell = parseInt(sellQuantityInput.value) || 0;
    if (qtyToSell <= 0 || qtyToSell > selectedBlookToSell.ownedCount) return;

    const valuePerUnit = sellValueMap[selectedBlookToSell.rarity] || 5;
    const payoutGained = qtyToSell * valuePerUnit;

    try {
        confirmSellBtn.disabled = true;

        let itemsRemoved = 0;
        userInventoryArray = userInventoryArray.filter(blookName => {
            if (blookName === selectedBlookToSell.name && itemsRemoved < qtyToSell) {
                itemsRemoved++;
                return false; 
            }
            return true; 
        });

        userTokens += payoutGained;

        const firestoreModule = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
        await firestoreModule.updateDoc(currentUserRef, {
            tokens: userTokens,
            inventory: userInventoryArray
        });

        tokenCounterValue.textContent = userTokens.toLocaleString();
        renderInventoryLayout();
        closeSellWindow();
    } catch(err) {
        console.error("Sale operation transaction failed:", err);
        alert("Transaction failed. Please try again.");
    } finally {
        confirmSellBtn.disabled = false;
    }
});

/* ====================================
   INITIAL AUTH STATE LISTENERS
==================================== */
onAuthStateChanged(auth, async (user) => {
    if (user) {
        try {
            const firestoreModule = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
            currentUserRef = firestoreModule.doc(db, "users", user.uid);
            
            const userSnap = await firestoreModule.getDoc(currentUserRef);
            if (userSnap.exists()) {
                const userData = userSnap.data();
                userTokens = userData.tokens || 0;
                userInventoryArray = Array.isArray(userData.inventory) ? userData.inventory : [];
                
                tokenCounterValue.textContent = userTokens.toLocaleString();
                renderInventoryLayout();
            }
        } catch (err) {
            console.error("Failed to load user profile data sets:", err);
        }

        document.getElementById('logout-hud-btn').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = "login.html";
            });
        });
    } else {
        window.location.href = "login.html";
    }
});
</script>

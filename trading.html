<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scratchlet - Trading</title>
<link rel="icon" type="image/webp" sizes="32x32" href="https://i.postimg.cc/zXFdxKTw/Icon-Tab.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Titan+One&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
/* =========================
   GLOBAL & HIDE SCROLLBAR
========================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body {
    scrollbar-width: none; 
}

::-webkit-scrollbar {
    display: none;
}

body{
    font-family:"Nunito",sans-serif;
    color:white;
    overflow-x:hidden;
    min-height:100vh;
    background: #ff9b2f;
    position: relative;
    display: flex;
    flex-direction: column;
}

/* =========================
   BACKGROUND LAYERS
========================= */
.bg-base-gradient {
    position: fixed;
    inset: 0;
    z-index: -3;
    background: linear-gradient(160deg, #fff4d6 0%, #ffc76a 25%, #ff9b2f 50%, #ff7f11 75%, #8f3200 100%);
}

.bg-moving-grid {
    position: fixed;
    top: -50vh;
    left: -50vw;
    width: 200vw;
    height: 200vh;
    z-index: -2;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="126" height="126" viewBox="0 0 126 126"><rect x="0.5" y="0.5" width="61" height="61" rx="13.5" fill="rgba(0,0,0,0.18)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/><rect x="63.5" y="63.5" width="61" height="61" rx="13.5" fill="rgba(0,0,0,0.18)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/></svg>');
    background-size: 126px 126px;
    background-position: 63px 0px;
    will-change: transform;
    animation: scrollTiltedTopRight 8s linear infinite;
}

@keyframes scrollTiltedTopRight {
    from { transform: rotate(15deg) translate3d(0px, 0px, 0px); }
    to { transform: rotate(15deg) translate3d(126px, -126px, 0px); }
}

/* =========================
   STICKY NAVBAR
========================= */
.navbar{
    position: sticky;
    top: 0;
    min-height:70px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 30px;
    background: rgba(255, 127, 17, 0.94);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    box-shadow: inset 0 -6px 0 0 #c65b00, 0 8px 24px rgba(0, 0, 0, 0.25);
    z-index: 100;
    gap: 15px;
}

.nav-left-group {
    display: flex;
    align-items: center;
    gap: 20px;
}

.logo-link {
    text-decoration: none;
    display: inline-block;
}

.logo{
    font-family:"Titan One",cursive;
    font-size:2.5rem;
    color:white;
}

.nav-right-group {
    display: flex;
    gap: 12px;
    align-items: center;
}

.coin-counter {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 900;
    background: rgba(0, 0, 0, 0.35);
    padding: 6px 14px;
    border-radius: 99px;
    border: 2px solid #ffcc00;
}

.coin-icon {
    width: 24px;
    height: 24px;
    object-fit: contain;
}

.coin-amount {
    color: #ffd700;
    font-size: 1.05rem;
}

.hud-badge-bar {
    display: flex;
    align-items: center;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 99px;
    padding: 6px 12px;
    gap: 8px;
}

.hud-item {
    color: white;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    cursor: pointer;
    background: transparent;
    border: none;
    position: relative;
    transition: background 0.15s, transform 0.1s;
}

.hud-item:hover {
    background: rgba(255, 255, 255, 0.15);
    transform: scale(1.05);
}

.hud-item::after {
    content: attr(data-nametag);
    position: absolute;
    top: 50px;
    left: 50%;
    transform: translateX(-50%) translateY(-6px);
    background: rgba(0, 0, 0, 0.9);
    color: white;
    font-weight: 800;
    font-size: 0.8rem;
    padding: 5px 10px;
    border-radius: 8px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: all 0.15s;
    z-index: 110;
}

.hud-item:hover::after {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* =========================
   TRADING GRID INTERFACE
========================= */
.trading-container {
    flex: 1;
    max-width: 1200px;
    width: 100%;
    margin: 30px auto;
    padding: 0 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    z-index: 5;
}

.status-indicator {
    text-align: center;
    font-weight: 900;
    font-size: 1.3rem;
    color: #ffcc00;
    background: rgba(0,0,0,0.4);
    padding: 12px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.1);
}

.trade-card {
    background: rgba(0, 0, 0, 0.3);
    border: 2px solid rgba(255, 255, 255, 0.15);
    border-radius: 24px;
    padding: 25px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.card-title {
    font-family: "Titan One", cursive;
    font-size: 1.6rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 2px solid rgba(255,255,255,0.1);
    padding-bottom: 10px;
}

.offer-window {
    background: rgba(0,0,0,0.2);
    border-radius: 16px;
    padding: 15px;
    min-height: 180px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
    gap: 12px;
    align-content: start;
}

.inventory-selection {
    background: rgba(0,0,0,0.15);
    border-radius: 16px;
    padding: 15px;
    height: 250px;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
    gap: 10px;
    align-content: start;
}

/* BLOOK DISPLAY ITEM */
.blook-item {
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 8px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.1s, background-color 0.15s;
    position: relative;
}

.blook-item:hover {
    transform: scale(1.03);
    background: rgba(255,255,255,0.15);
}

.blook-img {
    width: 50px;
    height: 50px;
    object-fit: contain;
}

.blook-count {
    position: absolute;
    top: 4px;
    right: 6px;
    background: #ff9b2f;
    font-size: 0.75rem;
    font-weight: 900;
    padding: 1px 6px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.25);
}

.blook-name {
    font-size: 0.75rem;
    font-weight: 700;
    margin-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* TOKEN TRADING INTERFACE */
.token-offer-box {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(0,0,0,0.25);
    padding: 12px;
    border-radius: 14px;
}

.token-offer-input {
    background: rgba(0,0,0,0.3);
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 8px;
    color: white;
    font-family: inherit;
    font-weight: 700;
    width: 100%;
    outline: none;
}

/* ACTION SECTION */
.action-panel {
    grid-column: 1 / -1;
    display: flex;
    justify-content: center;
    gap: 20px;
    background: rgba(0,0,0,0.35);
    padding: 20px;
    border-radius: 18px;
}

.btn {
    font-family: "Nunito", sans-serif;
    font-weight: 900;
    border: none;
    cursor: pointer;
    padding: 14px 32px;
    border-radius: 14px;
    font-size: 1.1rem;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    transition: all 0.1s ease;
}

.btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.2);
}

.btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.accept-btn { background: #4caf50; color: white; box-shadow: 0 4px 0 #388e3c; }
.accept-btn:active { box-shadow: 0 1px 0 #388e3c; }
.decline-btn { background: #ff5252; color: white; box-shadow: 0 4px 0 #d32f2f; }
.decline-btn:active { box-shadow: 0 1px 0 #d32f2f; }
</style>
</head>
<body>

<div class="bg-base-gradient"></div>
<div class="bg-moving-grid"></div>

<nav class="navbar">
    <div class="nav-left-group">
        <a href="dashboard.html" class="logo-link"><h1 class="logo">Scratchlet</h1></a>
    </div>
    <div class="nav-right-group">
        <div class="coin-counter">
            <img src="https://i.postimg.cc/zXFdxKTw/Icon-Tab.webp" class="coin-icon" alt="Tokens">
            <span class="coin-amount" id="token-display">0</span>
        </div>
        <div class="hud-badge-bar">
            <a href="dashboard.html" class="hud-item" data-nametag="Dashboard"><span class="material-icons">dashboard</span></a>
            <a href="inventory.html" class="hud-item" data-nametag="Inventory"><span class="material-icons">inventory_2</span></a>
            <a href="chat.html" class="hud-item" data-nametag="Chat"><span class="material-icons">chat</span></a>
            <a href="stats.html" class="hud-item" data-nametag="Stats"><span class="material-icons">leaderboard</span></a>
            <button class="hud-item" id="logout-btn" data-nametag="Logout"><span class="material-icons">logout</span></button>
        </div>
    </div>
</nav>

<div class="trading-container">
    <div class="status-indicator" id="trade-status-banner" style="grid-column:1/-1;">Connecting to Trade Session...</div>

    <div class="trade-card">
        <h2 class="card-title">Your Offer</h2>
        <div class="offer-window" id="your-offers-box"></div>
        <div class="token-offer-box">
            <label style="font-weight:800;">Offer Tokens:</label>
            <input type="number" id="your-token-input" class="token-offer-input" value="0" min="0">
        </div>
        <h3 style="font-weight:800; margin-top: 10px;">Your Inventory Items</h3>
        <div class="inventory-selection" id="your-inventory-box"></div>
    </div>

    <div class="trade-card">
        <h2 class="card-title" id="partner-username-title">Partner's Offer</h2>
        <div class="offer-window" id="partner-offers-box"></div>
        <div class="token-offer-box">
            <span style="font-weight:800;">Offered Tokens:</span>
            <span id="partner-token-display" style="color:#ffd700; font-weight:900; margin-left:auto;">0</span>
        </div>
        <div style="flex:1; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.15); border-radius:16px; min-height: 200px;">
            <p style="opacity:0.5; font-weight:700; text-align:center; padding: 20px;">Reviewing partner adjustments incoming live...</p>
        </div>
    </div>

    <div class="action-panel">
        <button class="btn decline-btn" id="cancel-trade-btn">Cancel Trade</button>
        <button class="btn accept-btn" id="lock-trade-btn">Lock Deal</button>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, onSnapshot, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// Your verified Firebase web configuration payload
const firebaseConfig = {
  apiKey: "AIzaSyBNZBOY8xzZOlxAD9V_RUqY054-kKod8gE",
  authDomain: "scratchlet-194bc.firebaseapp.com",
  projectId: "scratchlet-194bc",
  storageBucket: "scratchlet-194bc.firebasestorage.app",
  messagingSenderId: "480952290764",
  appId: "1:480952290764:web:0be65205e0b3ff2db16169",
  measurementId: "G-2T6GS8Y9VN"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUserUid = null;
let currentTradeId = new URLSearchParams(window.location.search).get("id");
let tradeRef = null;
let userData = null;

let yourOfferedBlooks = [];
let yourOfferedTokens = 0;
let transactionExecuted = false;

if (!currentTradeId) {
    alert("No active transaction context code detected! Returning to dashboard.");
    window.location.href = "dashboard.html";
}

onAuthStateChanged(auth, async (user) => {
    if (user) {
        currentUserUid = user.uid;
        tradeRef = doc(db, "trades", currentTradeId);
        
        // Load User Profile Data
        const uSnap = await getDoc(doc(db, "users", currentUserUid));
        if (uSnap.exists()) {
            userData = uSnap.data();
            document.getElementById("token-display").textContent = (userData.tokens || 0).toLocaleString();
            renderYourInventory();
        }

        // Initialize Realtime Sync Connection
        listenToTradeSession();
    } else {
        window.location.href = "login.html";
    }
});

function renderYourInventory() {
    const box = document.getElementById("your-inventory-box");
    box.innerHTML = "";
    
    const rawInventory = userData.inventory || [];
    const mappedCounts = {};
    
    if (Array.isArray(rawInventory)) {
        rawInventory.forEach(item => mappedCounts[item] = (mappedCounts[item] || 0) + 1);
    } else {
        Object.assign(mappedCounts, rawInventory);
    }

    Object.keys(mappedCounts).forEach(blookName => {
        if(mappedCounts[blookName] <= 0) return;
        
        const div = document.createElement("div");
        div.className = "blook-item";
        div.innerHTML = `
            <div class="blook-count">x${mappedCounts[blookName]}</div>
            <img src="https://i.postimg.cc/zXFdxKTw/Icon-Tab.webp" class="blook-img">
            <div class="blook-name">${blookName}</div>
        `;
        div.addEventListener("click", () => offerBlookItem(blookName, mappedCounts[blookName]));
        box.appendChild(div);
    });
}

function offerBlookItem(name, maxOwned) {
    const currentCount = yourOfferedBlooks.filter(b => b === name).length;
    if (currentCount >= maxOwned) return;

    yourOfferedBlooks.push(name);
    updateFirestoreOffer();
}

document.getElementById("your-token-input").addEventListener("input", (e) => {
    let val = parseInt(e.target.value) || 0;
    if (val > (userData.tokens || 0)) val = userData.tokens || 0;
    if (val < 0) val = 0;
    
    yourOfferedTokens = val;
    updateFirestoreOffer();
});

async function updateFirestoreOffer() {
    if (!tradeRef || transactionExecuted) return;
    const updatePayload = {};
    
    const tradeSnap = await getDoc(tradeRef);
    if (!tradeSnap.exists()) return;
    
    const tradeData = tradeSnap.data();
    if (tradeData.senderUid === currentUserUid) {
        updatePayload.senderBlooks = yourOfferedBlooks;
        updatePayload.senderTokens = yourOfferedTokens;
        updatePayload.senderLocked = false; 
    } else {
        updatePayload.receiverBlooks = yourOfferedBlooks;
        updatePayload.receiverTokens = yourOfferedTokens;
        updatePayload.receiverLocked = false;
    }
    await updateDoc(tradeRef, updatePayload);
}

function listenToTradeSession() {
    onSnapshot(tradeRef, (docSnap) => {
        if (transactionExecuted) return;
        
        if (!docSnap.exists()) {
            document.getElementById("trade-status-banner").textContent = "Trade Cancelled or Completed.";
            setTimeout(() => { window.location.href = "dashboard.html"; }, 2000);
            return;
        }

        const tData = docSnap.data();
        if(tData.status === "cancelled") {
            document.getElementById("trade-status-banner").textContent = "Trade was cancelled by a user.";
            setTimeout(() => { window.location.href = "dashboard.html"; }, 2000);
            return;
        }

        const isSender = tData.senderUid === currentUserUid;
        const dynamicPartnerName = isSender ? (tData.receiverName || "Partner") : (tData.senderName || "Partner");
        document.getElementById("partner-username-title").textContent = `${dynamicPartnerName}'s Offer`;

        // Render Offers Boxes
        renderOfferDisplay(document.getElementById("your-offers-box"), isSender ? tData.senderBlooks : tData.receiverBlooks, true);
        renderOfferDisplay(document.getElementById("partner-offers-box"), isSender ? tData.receiverBlooks : tData.senderBlooks, false);

        document.getElementById("partner-token-display").textContent = (isSender ? (tData.receiverTokens || 0) : (tData.senderTokens || 0)).toLocaleString();

        // Check locks status 
        const banner = document.getElementById("trade-status-banner");
        const youLocked = isSender ? tData.senderLocked : tData.receiverLocked;
        const partnerLocked = isSender ? tData.receiverLocked : tData.senderLocked;

        document.getElementById("lock-trade-btn").disabled = youLocked;

        if (tData.senderLocked && tData.receiverLocked) {
            banner.textContent = "Processing secure trade execution transaction...";
            executeSecureTrade(tData);
        } else {
            banner.textContent = `Your Status: ${youLocked ? '🔒 Locked' : '✏️ Editing'} | Partner Status: ${partnerLocked ? '🔒 Locked' : '✏️ Editing'}`;
        }
    });
}

function renderOfferDisplay(container, blookArray, isOwnOffer) {
    container.innerHTML = "";
    if (!blookArray || blookArray.length === 0) {
        container.innerHTML = `<div style="grid-column: 1/-1; text-align:center; opacity:0.4; font-size:0.85rem; padding-top:20px;">No items offered</div>`;
        return;
    }

    blookArray.forEach((name, index) => {
        const item = document.createElement("div");
        item.className = "blook-item";
        item.innerHTML = `
            <img src="https://i.postimg.cc/zXFdxKTw/Icon-Tab.webp" class="blook-img">
            <div class="blook-name">${name}</div>
        `;
        if (isOwnOffer) {
            item.title = "Click to remove item from offer";
            item.addEventListener('click', () => {
                yourOfferedBlooks.splice(index, 1);
                updateFirestoreOffer();
            });
        }
        container.appendChild(item);
    });
}

document.getElementById("lock-trade-btn").addEventListener("click", async () => {
    if(!tradeRef || transactionExecuted) return;
    const tradeSnap = await getDoc(tradeRef);
    if (!tradeSnap.exists()) return;
    
    const tData = tradeSnap.data();
    const isSender = tData.senderUid === currentUserUid;
    
    await updateDoc(tradeRef, {
        [isSender ? "senderLocked" : "receiverLocked"]: true
    });
});

document.getElementById("cancel-trade-btn").addEventListener("click", async () => {
    if(tradeRef) {
        await updateDoc(tradeRef, { status: "cancelled" });
    }
    window.location.href = "dashboard.html";
});

async function executeSecureTrade(tradeData) {
    if (transactionExecuted) return;
    transactionExecuted = true;

    try {
        await runTransaction(db, async (transaction) => {
            const senderUserRef = doc(db, "users", tradeData.senderUid);
            const receiverUserRef = doc(db, "users", tradeData.receiverUid);

            const sSnap = await transaction.get(senderUserRef);
            const rSnap = await transaction.get(receiverUserRef);

            if (!sSnap.exists() || !rSnap.exists()) {
                throw "One of the users does not exist!";
            }

            let sInv = Array.isArray(sSnap.data().inventory) ? [...sSnap.data().inventory] : [];
            let rInv = Array.isArray(rSnap.data().inventory) ? [...rSnap.data().inventory] : [];
            let sTok = sSnap.data().tokens || 0;
            let rTok = rSnap.data().tokens || 0;

            // Verification checks for items safety
            const sBlooksOffered = tradeData.senderBlooks || [];
            const rBlooksOffered = tradeData.receiverBlooks || [];
            const sTokensOffered = tradeData.senderTokens || 0;
            const rTokensOffered = tradeData.receiverTokens || 0;

            if (sTok < sTokensOffered || rTok < rTokensOffered) {
                throw "Insufficient token funds detected during validation check!";
            }

            // Remove items from Sender, add to Receiver
            for (const blook of sBlooksOffered) {
                const idx = sInv.indexOf(blook);
                if (idx === -1) throw `Sender lacks item: ${blook}`;
                sInv.splice(idx, 1);
                rInv.push(blook);
            }

            // Remove items from Receiver, add to Sender
            for (const blook of rBlooksOffered) {
                const idx = rInv.indexOf(blook);
                if (idx === -1) throw `Receiver lacks item: ${blook}`;
                rInv.splice(idx, 1);
                sInv.push(blook);
            }

            // Balances processing 
            sTok = sTok - sTokensOffered + rTokensOffered;
            rTok = rTok - rTokensOffered + sTokensOffered;

            transaction.update(senderUserRef, { inventory: sInv, tokens: sTok });
            transaction.update(receiverUserRef, { inventory: rInv, tokens: rTok });
            transaction.delete(tradeRef);
        });

        alert("Trade executed successfully!");
        window.location.href = "inventory.html";
    } catch(err) {
        console.error("Atomic atomic validation failed: ", err);
        alert("Transaction failed validation checks: " + err);
        transactionExecuted = false;
        window.location.href = "dashboard.html";
    }
}

document.getElementById('logout-btn').addEventListener('click', () => {
    signOut(auth).then(() => { window.location.href = "login.html"; });
});
</script>
</body>
</html>
